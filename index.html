<body>
  <div id="root"></div>

  <script type="text/babel">
    "use strict";

    const { useState, useEffect, useRef, useMemo } = React;
    const { createRoot } = ReactDOM;
    const ChartJS = window.Chart;

    // --- UTILITIES ---
    class XORShift {
      constructor(seed) {
        this.seed(seed);
      }
      seed(s) {
        this.a = s >>> 0;
        if (typeof s === "string") {
          let hash = 1779033703 ^ s.length;
          for (let i = 0; i < s.length; i++) {
            hash = Math.imul(hash ^ s.charCodeAt(i), 3432918353);
            hash = (hash << 13) | (hash >>> 19);
          }
          this.a = hash >>> 0;
        }
        if (this.a === 0) this.a = 0xdeadbeef;
      }
      random() {
        this.a ^= this.a << 13;
        this.a ^= this.a >>> 17;
        this.a ^= this.a << 5;
        return (this.a >>> 0) / 4294967296;
      }
      gaussian() {
        let u1 = 0,
          u2 = 0;
        while (u1 === 0) u1 = this.random();
        u2 = this.random();
        const R = Math.sqrt(-2.0 * Math.log(u1));
        const T = 2.0 * Math.PI * u2;
        return R * Math.cos(T);
      }
    }

    // Substance database (educational values; some are approximations)
    const Substances = {

      },
      sodium_chloride: {
        key: "sodium_chloride",
        name: "Sodium Chloride",

      butter: {

        c_solid: 2100,

      }

    // Data logger (CSV unchanged; we only trim on-screen)
    class DataLogger {
      constructor() {
        this.data = [];
        this.metadata = {};
        this.header = [
          "time_s",
          "heater_power_W",
          "heat_input_J_step",
          "cumulative_heat_J",
          "temp_true_C",
          "temp_measured_C",
          "phase",
          "mass_kg",
          "melted_mass_kg",
          "boiled_mass_kg",
          "heat_loss_W",
          "instrument_id",
          "seed"
        ].join(",");
      }
      setMetadata(m) {
        this.metadata = m;
      }
      addEntry(e) {
        this.data.push(e);
      }
      clear() {
        this.data = [];
      }
      generateCSV() {
        let csv = "";
        csv += `# Virtual Lab Export\n`;
        csv += `# Date: ${new Date().toISOString()}\n`;
        for (const [k, v] of Object.entries(this.metadata))
          csv += `# ${k}: ${v}\n`;
        csv += "\n" + this.header + "\n";
        csv += this.data
          .map((row) =>
            [
              row.time_s.toFixed(2),
              row.heater_power_W.toFixed(2),
              row.heat_input_J_step.toFixed(3),
              row.cumulative_heat_J.toFixed(2),
              row.temp_true_C.toFixed(2),
              row.temp_measured_C.toFixed(1),
              row.phase,
              row.mass_kg.toFixed(4),
              row.melted_mass_kg.toFixed(4),
              row.boiled_mass_kg.toFixed(4),
              row.heat_loss_W.toFixed(2),
              row.instrument_id,
              row.seed
            ].join(",")
          )
          .join("\n");
        return csv;
      }
    }

    // Instrument model
    class InstrumentModel {
      constructor(type, rng) {
        this.rng = rng;
        this.type = type;
        this.measuredValue_C = -10.0;
        if (type === "digital") {
          this.sigma = 0.08;
          this.tau = 1.2;
          this.resolution = 0.1;
        } else if (type === "thermocouple") {
          this.sigma = 0.03;
          this.tau = 0.25;
          this.resolution = 0.05;
        } else {
          this.sigma = 0.4;
          this.tau = 2.5;
          this.resolution = 0.5;
        }
      }
      reset(initialTemp) {
        this.measuredValue_C = initialTemp;
      }
      measure(trueValue_C, dt) {
        const dT_lag = ((trueValue_C - this.measuredValue_C) / this.tau) * dt;
        this.measuredValue_C += dT_lag;
        const noise = this.rng.gaussian() * this.sigma;
        let finalValue = this.measuredValue_C + noise;
        finalValue = Math.round(finalValue / this.resolution) * this.resolution;
        return finalValue;
      }
    }

    // Physics engine
    class PhysicsEngine {
      constructor(substance, seed) {
        this.rng = new XORShift(seed || 12345);
        this.seed = seed || 12345;
        this.substance = substance;
        this.logger = new DataLogger();
        this.instruments = {
          digital: new InstrumentModel("digital", this.rng),
          thermocouple: new InstrumentModel("thermocouple", this.rng)
        };
        this.reset();
      }
      setSubstance(substance) {
        this.substance = substance;
      }
      reset(newSeed) {
        if (newSeed !== undefined && newSeed !== null && newSeed !== "") {
          this.seed = newSeed;
          this.rng.seed(newSeed);
        }
        this.time_s = 0;
        this.T_true_C = -10.0;
        this.phase = "solid";
        this.mass_kg = 0.05;
        this.melted_mass_kg = 0;
        this.boiled_mass_kg = 0;
        this.cumulative_heat_J = 0;
        Object.values(this.instruments).forEach((i) => i.reset(this.T_true_C));
        this.logger.clear();
      }
      step(dt, P_applied, hA, T_ambient, mass_kg, instrument_id) {
        this.mass_kg = mass_kg;
        const { T_m, T_b, c_solid, c_liquid, c_gas } = this.substance;

        const P_noise = (this.rng.random() - 0.5) * 0.04 * P_applied;
        const P_actual = Math.max(0, P_applied + P_noise);
        const Q_in = P_actual * dt;
        const Q_loss = hA * (this.T_true_C - T_ambient) * dt;
        const Q_net = Q_in - Q_loss;
        const heat_loss_W = Q_loss / dt;
        this.cumulative_heat_J += Q_in;

        if (this.phase === "solid") {
          const deltaT = Q_net / (this.mass_kg * c_solid);
          if (this.T_true_C + deltaT < T_m) {
            this.T_true_C += deltaT;
          } else {
            const Q_to_reach_Tm =
              (T_m - this.T_true_C) * this.mass_kg * c_solid;
            const Q_remaining_for_melt = Q_net - Q_to_reach_Tm;
            this.T_true_C = T_m;
            this.phase = "solid+liquid";
            this.processMelting(Q_remaining_for_melt);
          }
        } else if (this.phase === "solid+liquid") {
          this.T_true_C = T_m;
          this.processMelting(Q_net);
        } else if (this.phase === "liquid") {
          const deltaT = Q_net / (this.mass_kg * c_liquid);
          if (this.T_true_C + deltaT < T_b) {
            this.T_true_C += deltaT;
          } else {
            const Q_to_reach_Tb =
              (T_b - this.T_true_C) * this.mass_kg * c_liquid;
            const Q_remaining_for_boil = Q_net - Q_to_reach_Tb;
            this.T_true_C = T_b;
            this.phase = "liquid+gas";
            this.processBoiling(Q_remaining_for_boil);
          }
        } else if (this.phase === "liquid+gas") {
          this.T_true_C = T_b;
          this.processBoiling(Q_net);
        } else if (this.phase === "gas") {
          const deltaT = Q_net / (this.mass_kg * c_gas);
          this.T_true_C += deltaT;
        }

        const activeInstrument =
          this.instruments[instrument_id] || this.instruments.digital;
        const T_measured = activeInstrument.measure(this.T_true_C, dt);
        const logEntry = {
          time_s: this.time_s,
          heater_power_W: P_actual,
          heat_input_J_step: Q_in,
          cumulative_heat_J: this.cumulative_heat_J,
          temp_true_C: this.T_true_C,
          temp_measured_C: T_measured,
          phase: this.phase,
          mass_kg: this.mass_kg,
          melted_mass_kg: this.melted_mass_kg,
          boiled_mass_kg: this.boiled_mass_kg,
          heat_loss_W: heat_loss_W,
          instrument_id: instrument_id,
          seed: this.seed
        };
        this.logger.addEntry(logEntry);
        this.time_s += dt;
        return this.getState();
      }
      processMelting(Q_available) {
        if (Q_available <= 0) return;
        const mass_yet_to_melt = this.mass_kg - this.melted_mass_kg;
        const Q_to_melt_all = mass_yet_to_melt * this.substance.L_f;
        if (Q_available < Q_to_melt_all) {
          this.melted_mass_kg += Q_available / this.substance.L_f;
        } else {
          const Q_remaining_for_liquid = Q_available - Q_to_melt_all;
          this.melted_mass_kg = this.mass_kg;
          this.phase = "liquid";
          this.T_true_C =
            this.substance.T_m +
            Q_remaining_for_liquid / (this.mass_kg * this.substance.c_liquid);
        }
      }
      processBoiling(Q_available) {
        if (Q_available <= 0) return;
        const mass_yet_to_boil = this.mass_kg - this.boiled_mass_kg;
        const Q_to_boil_all = mass_yet_to_boil * this.substance.L_v;
        if (Q_available < Q_to_boil_all) {
          this.boiled_mass_kg += Q_available / this.substance.L_v;
        } else {
          const Q_remaining_for_gas = Q_available - Q_to_boil_all;
          this.boiled_mass_kg = this.mass_kg;
          this.phase = "gas";
          this.T_true_C =
            this.substance.T_b +
            Q_remaining_for_gas / (this.mass_kg * this.substance.c_gas);
        }
      }
      getState() {
        const lastEntry = this.logger.data[this.logger.data.length - 1] || {};
        return {
          time: this.time_s,
          T_true: this.T_true_C,
          T_measured: lastEntry.temp_measured_C ?? this.T_true_C,
          phase: this.phase,
          melt_fraction:
            this.mass_kg > 0 ? this.melted_mass_kg / this.mass_kg : 0,
          boil_fraction:
            this.mass_kg > 0 ? this.boiled_mass_kg / this.mass_kg : 0,
          logEntry: lastEntry
        };
      }
    }

    // Exponential moving average for display calmness
    function useEMA(value, alpha = 0.2) {
      const [smoothed, setSmoothed] = useState(value);
      const ref = useRef(value);
      useEffect(() => {
        const next = alpha * value + (1 - alpha) * ref.current;
        ref.current = next;
        setSmoothed(next);
      }, [value, alpha]);
      return smoothed;
    }

    // --- REACT COMPONENTS ---
    function Controls({
      settings,
      setSettings,
      onStart,
      onStop,
      onReset,
      isRunning,
      solidFloats
    }) {
      const handleChange = (e) => {
        const { name, value, type } = e.target;
        setSettings((prev) => ({
          ...prev,
          [name]: type === "number" || type === "range" ? parseFloat(value) : value
        }));
      };
      const handleSeedChange = (e) =>
        setSettings((prev) => ({ ...prev, seed: e.target.value }));

      return (
        <div className="panel left-panel">
          <h2>🧪 Controls</h2>
          <div className="button-group">
            <button className="start" onClick={onStart} disabled={isRunning}>
              Start
            </button>
            <button className="stop" onClick={onStop} disabled={!isRunning}>
              Stop
            </button>
            <button className="reset" onClick={onReset} disabled={isRunning}>
              Reset
            </button>
          </div>

          <h3>Simulation Setup</h3>
          <div className="control-group">
            <label htmlFor="seed">
              Random seed (optional) <span className="badge">reproducibility</span>
            </label>
            <input
              type="text"
              id="seed"
              name="seed"
              placeholder="e.g., lesson1 or 12345"
              value={settings.seed}
              onChange={handleSeedChange}
              disabled={isRunning}
            />
            <div className="hint">
              Use any word/number. Same seed → same small variations and instrument
              noise.
            </div>
          </div>

          <div className="control-group">
            <label htmlFor="substanceKey">Substance</label>
            <select
              id="substanceKey"
              name="substanceKey"
              value={settings.substanceKey}
              onChange={handleChange}
              disabled={isRunning}
            >
              <option value="water">Water</option>
              <option value="ethanol">Ethanol</option>
              <option value="acetone">Acetone</option>
              <option value="mercury">Mercury</option>
              <option value="gallium">Gallium</option>
              <option value="sodium_chloride">Sodium Chloride</option>
              <option value="butter">Butter</option>
            </select>
            <div className="hint">
              Solid floats: <strong>{solidFloats ? "Yes" : "No"}</strong>
            </div>
          </div>

          <div className="control-group">
            <label htmlFor="mass">Sample Mass (g) [5–200]</label>
            <input
              type="range"
              id="mass"
              name="mass"
              min="5"
              max="200"
              step="5"
              value={settings.mass}
              onChange={handleChange}
              disabled={isRunning}
            />
            <span>{settings.mass} g</span>
          </div>

          <div className="control-group">
            <label htmlFor="power">Heater Power (W) [0–500]</label>
            <input
              type="range"
              id="power"
              name="power"
              min="0"
              max="500"
              step="10"
              value={settings.power}
              onChange={handleChange}
            />
            <span>{settings.power} W</span>
          </div>

          <h3>Environment & Equipment</h3>
          <div className="control-group">
            <label htmlFor="instrument">Instrument</label>
            <select
              id="instrument"
              name="instrument"
              value={settings.instrument}
              onChange={handleChange}
              disabled={isRunning}
            >
              <option value="digital">Digital (±0.1°C, 1.2s lag)</option>
              <option value="thermocouple">Thermocouple (±0.05°C, 0.25s lag)</option>
            </select>
          </div>

          <div className="control-group">
            <label htmlFor="insulation">Insulation Level (Heat Loss)</label>
            <select
              id="insulation"
              name="insulation"
              value={settings.insulation}
              onChange={handleChange}
            >
              <option value="1">None (High loss)</option>
              <option value="0.4">Foam (Medium loss)</option>
              <option value="0.1">Vacuum (Low loss)</option>
            </select>
          </div>

          <div className="control-group">
            <label htmlFor="T_ambient">Ambient Temp (°C)</label>
            <input
              type="number"
              id="T_ambient"
              name="T_ambient"
              min="-20"
              max="40"
              step="1"
              value={settings.T_ambient}
              onChange={handleChange}
            />
          </div>
        </div>
      );
    }

    function MacroView({ simState, solidFloats, displayTemps }) {
      const canvasRef = useRef(null);
      const T_trueDisp = useMemo(
        () =>
          Number(
            (displayTemps?.T_true ?? simState?.T_true ?? 0).toFixed(2)
          ),
        [displayTemps?.T_true, simState?.T_true]
      );
      const T_measDisp = useMemo(
        () =>
          Number(
            (displayTemps?.T_measured ?? simState?.T_measured ?? 0).toFixed(1)
          ),
        [displayTemps?.T_measured, simState?.T_measured]
      );

      useEffect(() => {
        if (!canvasRef.current || !simState) return;
        const { melt_fraction, boil_fraction } = simState;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#f4f7fb";
        ctx.fillRect(0, 0, w, h);

        const beakerW = w * 0.6;
        const beakerH = h * 0.8;
        const beakerX = (w - beakerW) / 2;
        const beakerY = h * 0.1;
        const beakerBottom = beakerY + beakerH;
        ctx.strokeStyle = "#666";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(beakerX, beakerY);
        ctx.lineTo(beakerX, beakerBottom);
        ctx.lineTo(beakerX + beakerW, beakerBottom);
        ctx.lineTo(beakerX + beakerW, beakerY);
        ctx.stroke();

        const contentH = beakerH * 0.8;
        const fracSolid = Math.max(0, 1 - melt_fraction);
        const fracLiquid = Math.max(0, melt_fraction - boil_fraction);
        const fracGas = Math.max(0, boil_fraction);
        const liquidH = contentH * fracLiquid;
        const solidH = contentH * fracSolid;
        const contentY = beakerBottom - contentH;

        if (liquidH > 1) {
          ctx.fillStyle = "rgba(0, 120, 220, 0.65)";
          ctx.fillRect(beakerX, beakerBottom - liquidH, beakerW, liquidH);
        }
        if (solidH > 1) {
          ctx.fillStyle = "rgba(173, 216, 230, 0.9)";
          const blockH = Math.min(solidH, contentH * 0.5);
          const solidY = solidFloats
            ? Math.max(beakerY + 8, beakerBottom - liquidH - blockH - 4)
            : beakerBottom - blockH;
          ctx.fillRect(beakerX + 6, solidY, beakerW - 12, blockH);
          ctx.strokeStyle = "#9ecde6";
          ctx.strokeRect(beakerX + 6, solidY, beakerW - 12, blockH);
        }
        if (fracGas > 0.01) {
          ctx.fillStyle = "rgba(180,180,180,0.35)";
          const plumeCount = Math.min(60, Math.floor(15 + fracGas * 80));
          for (let i = 0; i < plumeCount; i++) {
            const x = beakerX + Math.random() * beakerW;
            const y = contentY - Math.random() * 24;
            const r = 2 + Math.random() * 4;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Thermometer (measured)
        const thermoX = w * 0.85;
        const thermoTop = h * 0.1;
        const thermoBottom = h * 0.9;
        const thermoH = thermoBottom - thermoTop;

        ctx.fillStyle = "#666";
        ctx.fillRect(thermoX - 2, thermoTop, 4, thermoH);
        ctx.beginPath();
        ctx.arc(thermoX, thermoBottom + 5, 8, 0, Math.PI * 2);
        ctx.fill();

        const tMin = -20,
          tMax = 120;
        const fillFrac = Math.max(
          0,
          Math.min(1, (T_measDisp - tMin) / (tMax - tMin))
        );
        const fillH = fillFrac * (thermoH - 10);
        ctx.fillStyle = "#dc3545";
        ctx.fillRect(thermoX - 2, thermoBottom - fillH, 4, fillH);
        ctx.beginPath();
        ctx.arc(thermoX, thermoBottom + 5, 6, 0, Math.PI * 2);
        ctx.fill();

        // water line
        ctx.strokeStyle = "#fff";
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(beakerX, beakerBottom - liquidH);
        ctx.lineTo(beakerX + beakerW, beakerBottom - liquidH);
        ctx.stroke();
        ctx.setLineDash([]);
      }, [simState, solidFloats, T_measDisp]);

      return (
        <>
          <h3>Macroscopic View</h3>
          <div className="legend">
            <span>
              <i
                className="swatch"
                style={{ background: "rgba(173,216,230,0.9)" }}
              ></i>{" "}
              Solid
            </span>
            <span>
              <i
                className="swatch"
                style={{ background: "rgba(0,120,220,0.65)" }}
              ></i>{" "}
              Liquid
            </span>
            <span>
              <i
                className="swatch"
                style={{ background: "rgba(180,180,180,0.35)" }}
              ></i>{" "}
              Gas
            </span>
          </div>
          <canvas
            ref={canvasRef}
            className="vis-canvas"
            width="420"
            height="260"
          ></canvas>
          <div className="data-readout">
            <p>
              Time: <strong>{(simState?.time ?? 0).toFixed(1)} s</strong>
            </p>
            <p>
              Phase: <strong>{simState?.phase || "..."}</strong>
            </p>
            <p>
              True Temp: <strong>{T_trueDisp.toFixed(1)} °C</strong>
            </p>
            <p>
              Measured Temp: <strong>{T_measDisp.toFixed(1)} °C</strong>
            </p>
          </div>
        </>
      );
    }

    // Atomic-scale view
    function AtomicView({ simState }) {
      const canvasRef = useRef(null);
      const particlesRef = useRef([]);
      const animRef = useRef(null);
      const totalParticles = 70;

      // Initialize particles arranged initially as a lattice (solid)
      useEffect(() => {
        const canvas = canvasRef.current;
        const w = canvas.width,
          h = canvas.height;
        const arr = [];
        const grid = Math.ceil(Math.sqrt(totalParticles));
        const spacingX = (w - 40) / grid;
        const spacingY = (h - 40) / grid;
        let count = 0;
        for (let i = 0; i < grid && count < totalParticles; i++) {
          for (let j = 0; j < grid && count < totalParticles; j++) {
            arr.push({
              x: 20 + i * spacingX + (Math.random() - 0.5) * 2,
              y: 20 + j * spacingY + (Math.random() - 0.5) * 2,
              vx: 0,
              vy: 0,
              baseX: 20 + i * spacingX,
              baseY: 20 + j * spacingY,
              type: "solid"
            });
            count++;
          }
        }
        particlesRef.current = arr;
        return () => {
          if (animRef.current) cancelAnimationFrame(animRef.current);
        };
      }, []);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        const w = canvas.width,
          h = canvas.height;
        const loop = () => {
          animRef.current = requestAnimationFrame(loop);
          ctx.fillStyle = "#222";
          ctx.fillRect(0, 0, w, h);

          const { melt_fraction = 0, boil_fraction = 0 } = simState || {};
          const fracSolid = Math.max(0, 1 - melt_fraction);
          const fracGas = Math.max(0, boil_fraction);
          let targetSolid = Math.round(totalParticles * fracSolid);
          let targetGas = Math.round(totalParticles * fracGas);
          if (targetSolid + targetGas > totalParticles)
            targetGas = Math.max(0, totalParticles - targetSolid);

          const parts = particlesRef.current;
          // Start all as liquid for this frame, then assign solid and gas
          parts.forEach((p) => (p.type = "liquid"));
          // solids near bottom
          parts.sort((a, b) => a.y - b.y);
          for (let i = 0; i < targetSolid; i++) parts[i].type = "solid";
          // gases near top
          parts.sort((a, b) => b.y - a.y);
          for (let i = 0; i < targetGas; i++) parts[i].type = "gas";

          const liquidLevel = h * 0.7;
          for (const p of parts) {
            let fx = 0,
              fy = 0;
            const speedLimit = { solid: 1.5, liquid: 3, gas: 6 }[p.type];

            if (p.type === "solid") {
              fx += (p.baseX - p.x) * 0.15 + (Math.random() - 0.5) * 0.4;
              fy += (p.baseY - p.y) * 0.15 + (Math.random() - 0.5) * 0.4;
              p.vx *= 0.85;
              p.vy *= 0.85;
            } else if (p.type === "liquid") {
              fx += (Math.random() - 0.5) * 0.6;
              fy += (Math.random() - 0.5) * 0.6 + 0.15; // gravity
              if (p.y > liquidLevel - 6) fy -= 0.2; // slight pressure near bottom
              // weak cohesion
              fx += (Math.random() - 0.5) * 0.1;
              fy += (Math.random() - 0.5) * 0.1;
              p.vx *= 0.94;
              p.vy *= 0.94;
            } else {
              // gas
              fx += (Math.random() - 0.5) * 1.6;
              fy += (Math.random() - 0.5) * 1.6 - 0.4; // buoyant upward
              p.vx *= 0.985;
              p.vy *= 0.985;
            }

            // integrate
            p.vx += fx;
            p.vy += fy;
            const sp = Math.hypot(p.vx, p.vy);
            if (sp > speedLimit) {
              p.vx = (p.vx / sp) * speedLimit;
              p.vy = (p.vy / sp) * speedLimit;
            }
            p.x += p.vx;
            p.y += p.vy;

            // boundaries
            if (p.x < 8) {
              p.x = 8;
              p.vx *= -0.6;
            }
            if (p.x > w - 8) {
              p.x = w - 8;
              p.vx *= -0.6;
            }
            if (p.y < 8) {
              p.y = 8;
              p.vy *= -0.6;
            }
            if (p.type !== "gas") {
              if (p.y > h - 10) {
                p.y = h - 10;
                p.vy *= -0.4;
              }
            } else {
              if (p.y > h - 8) {
                p.y = h - 8;
                p.vy *= -0.2;
              }
            }

            // draw
            let color = "#7fbfff";
            if (p.type === "solid") color = "#bfe8ff";
            if (p.type === "gas") color = "#ddd";
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
            ctx.fill();
          }
        };
        animRef.current = requestAnimationFrame(loop);
        return () => {
          if (animRef.current) cancelAnimationFrame(animRef.current);
        };
      }, [simState]);

      return (
        <>
          <h3>Atomic-Scale View (Simplified)</h3>
          <canvas
            ref={canvasRef}
            className="atomic-canvas"
            width="420"
            height="260"
          ></canvas>
        </>
      );
    }

    function GraphView({ logger, graphType }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext("2d");
        if (chartRef.current) chartRef.current.destroy();

        const labels =
          graphType === "time"
            ? logger.data.map((d) => Number(d.time_s.toFixed(1)))
            : logger.data.map((d) =>
                Number((d.cumulative_heat_J / 1000).toFixed(2))
              );

        const measured = logger.data.map((d) =>
          Number(d.temp_measured_C.toFixed(1))
        );
        const truth = logger.data.map((d) =>
          Number(d.temp_true_C.toFixed(1))
        );

        chartRef.current = new ChartJS(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Measured Temp (°C)",
                data: measured,
                borderColor: "rgba(220,53,69,0.9)",
                backgroundColor: "rgba(220,53,69,0.15)",
                borderWidth: 2,
                pointRadius: 0
              },
              {
                label: "True Temp (°C)",
                data: truth,
                borderColor: "rgba(0,123,255,0.9)",
                backgroundColor: "rgba(0,123,255,0.12)",
                borderWidth: 2,
                pointRadius: 0,
                borderDash: [5, 4]
              }
            ]
          },
          options: {
            animation: false,
            responsive: true,
            scales: {
              x: {
                title: {
                  display: true,
                  text:
                    graphType === "time"
                      ? "Time (s)"
                      : "Cumulative Heat Added (kJ)"
                },
                ticks: {
                  callback: (val, idx) => {
                    const raw = labels[idx];
                    return graphType === "time"
                      ? raw.toFixed(1)
                      : raw.toFixed(2);
                  }
                }
              },
              y: {
                title: { display: true, text: "Temperature (°C)" },
                ticks: { callback: (v) => Number(v).toFixed(0) }
              }
            },
            plugins: {
              tooltip: {
                callbacks: {
                  label: (ctx) =>
                    `${ctx.dataset.label}: ${Number(ctx.parsed.y).toFixed(
                      1
                    )} °C`,
                  title: (items) => {
                    const x = items[0].parsed.x;
                    return graphType === "time"
                      ? `t = ${Number(x).toFixed(1)} s`
                      : `Q = ${Number(x).toFixed(2)} kJ`;
                  }
                }
              },
              legend: { display: true },
              title: {
                display: true,
                text:
                  "Temperature vs. " +
                  (graphType === "time" ? "Time" : "Heat Added")
              }
            }
          }
        });

        return () => chartRef.current?.destroy();
      }, [logger.data.length, graphType]);

      return (
        <div className="graph-container">
          <canvas ref={canvasRef} width="420" height="320"></canvas>
        </div>
      );
    }

    function DataAndAnalysis({
      logger,
      onDownloadCSV,
      onAnalyze,
      analysis,
      onGraphTypeChange,
      graphType
    }) {
      return (
        <div className="data-tools">
          <h3>Data & Analysis</h3>
          <div className="control-group">
            <label htmlFor="graphType">Graph X-Axis</label>
            <select
              id="graphType"
              name="graphType"
              value={graphType}
              onChange={(e) => onGraphTypeChange(e.target.value)}
            >
              <option value="heat">Cumulative Heat (kJ)</option>
              <option value="time">Time (s)</option>
            </select>
          </div>
          <div className="button-group">
            <button
              onClick={onAnalyze}
              style={{ backgroundColor: "#17a2b8", color: "white" }}
            >
              Analyze
            </button>
            <button
              onClick={onDownloadCSV}
              style={{ backgroundColor: "#6c757d", color: "white" }}
            >
              Download CSV
            </button>
          </div>

          {analysis && (
            <div className="analysis-results">
              <strong>Quick Analysis</strong>
              <div style={{ marginTop: 6 }}>{analysis}</div>
            </div>
          )}
        </div>
      );
    }

    // --- APP ---
    function App() {
      const [settings, setSettings] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return {
          seed: params.get("seed") ?? "",
          substanceKey: "water",
          mass: 50,
          power: 200,
          instrument: "digital",
          insulation: 0.4,
          T_ambient: 20
        };
      });
      const [isRunning, setIsRunning] = useState(false);
      const [graphType, setGraphType] = useState("heat");
      const [sim, setSim] = useState(() => new PhysicsEngine(Substances["water"], ""));
      const [simState, setSimState] = useState(sim.getState());
      const [analysis, setAnalysis] = useState("");
      const intervalRef = useRef(null);

      // Teacher lock for graph (default locked; URL ?key=... unlocks)
      const [graphUnlocked, setGraphUnlocked] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        const key = params.get("key");
        return key ? true : false;
      });
      const [passwordInput, setPasswordInput] = useState("");
      const TEACHER_PASSWORD = useMemo(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get("key") || "science";
      }, []);

      // EMA for calmer on-screen display (CSV uses raw)
      const displayMeasured = useEMA(
        simState?.logEntry?.temp_measured_C ?? simState?.T_measured ?? -10,
        0.2
      );
      const displayTrue = useEMA(
        simState?.logEntry?.temp_true_C ?? simState?.T_true ?? -10,
        0.2
      );

      // Reset when seed changes
      useEffect(() => {
        sim.reset(settings.seed);
        setSimState(sim.getState());
      }, [settings.seed]);

      // Change substance: stop, new engine, reset
      useEffect(() => {
        if (isRunning && intervalRef.current) {
          clearInterval(intervalRef.current);
        }
        setIsRunning(false);
        const newSim = new PhysicsEngine(Substances[settings.substanceKey], settings.seed);
        setSim(newSim);
        setSimState(newSim.getState());
        setAnalysis("");
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [settings.substanceKey]);

      const start = () => {
        if (isRunning) return;
        setIsRunning(true);

        const baseLoss = 8; // W/K baseline
        const lossFactor = Number(settings.insulation);
        const hA = baseLoss * lossFactor;
        const dt = 0.1;
        const mass_kg = settings.mass / 1000;

        sim.logger.setMetadata({
          substance: Substances[settings.substanceKey].name,
          mass_g: settings.mass,
          instrument: settings.instrument,
          ambient_C: settings.T_ambient,
          heater_power_W: settings.power,
          insulation_factor: lossFactor,
          seed: settings.seed || "(none)"
        });

        intervalRef.current = setInterval(() => {
          const state = sim.step(
            dt,
            settings.power,
            hA,
            settings.T_ambient,
            mass_kg,
            settings.instrument
          );
          setSimState(state); // raw state; we smooth only for display
        }, dt * 1000);
      };

      const stop = () => {
        setIsRunning(false);
        if (intervalRef.current) clearInterval(intervalRef.current);
      };
      const reset = () => {
        if (intervalRef.current) clearInterval(intervalRef.current);
        setIsRunning(false);
        sim.reset(settings.seed);
        setSimState(sim.getState());
        setAnalysis("");
      };

      const onAnalyze = () => {
        const data = sim.logger.data;
        if (data.length < 10)
          return setAnalysis("Not enough data yet. Run the sim a bit longer.");
        const temps = data.map((d) => d.temp_measured_C);
        const heats = data.map((d) => d.cumulative_heat_J);
        const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
        const first = avg(temps.slice(0, Math.min(20, temps.length)));
        const last = avg(temps.slice(-Math.min(20, temps.length)));
        const totalQkJ = (heats[heats.length - 1] - heats[0]) / 1000;
        setAnalysis(
          `Start Avg: ${first.toFixed(1)} °C; End Avg: ${last.toFixed(
            1
          )} °C; Total heat added ≈ ${totalQkJ.toFixed(2)} kJ.`
        );
      };

      const onDownloadCSV = () => {
        const csv = sim.logger.generateCSV();
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const ts = new Date().toISOString().replace(/[:.]/g, "-");
        a.download = `virtual-lab-${ts}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const unlockGraph = () => {
        if (passwordInput.trim() === TEACHER_PASSWORD) setGraphUnlocked(true);
        else alert("Incorrect password");
      };

      const solidFloats = Substances[settings.substanceKey].solidFloats;

      return (
        <div className="app-container">
          <Controls
            settings={settings}
            setSettings={setSettings}
            onStart={start}
            onStop={stop}
            onReset={reset}
            isRunning={isRunning}
            solidFloats={solidFloats}
          />
          <div className="panel center-panel">
            <MacroView
              simState={simState}
              solidFloats={solidFloats}
              displayTemps={{ T_true: displayTrue, T_measured: displayMeasured }}
            />
            <AtomicView simState={simState} />
          </div>
          <div className="panel right-panel">
            {!graphUnlocked ? (
              <div className="graph-lock">
                <h3>Teacher Tools (Locked)</h3>
                <div className="control-group">
                  <label htmlFor="teacherPassword">
                    Enter password to unlock graph and data tools
                  </label>
                  <input
                    id="teacherPassword"
                    type="password"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    placeholder="Password"
                  />
                </div>
                <button onClick={unlockGraph} className="start">
                  Unlock
                </button>
                <div className="hint" style={{ marginTop: 8 }}>
                  Tip: Convenience gate only (not strong security). You can also
                  unlock via URL with ?key=YourPassword
                </div>
              </div>
            ) : (
              <>
                <GraphView logger={sim.logger} graphType={graphType} />
                <DataAndAnalysis
                  logger={sim.logger}
                  onDownloadCSV={onDownloadCSV}
                  onAnalyze={onAnalyze}
                  analysis={analysis}
                  onGraphTypeChange={setGraphType}
                  graphType={graphType}
                />
              </>
            )}
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
