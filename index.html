// Use strict mode for better error handling
"use strict";

// Import dependencies from global scope
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const { createRoot } = ReactDOM;
const { Chart } = window.Chart;

// --- UTILITIES ---

/**
 * (Spec 12) A deterministic pseudo-random number generator (PRNG).
 * Uses xorshift32 for simplicity and reproducibility.
 */
class XORShift {
    constructor(seed) {
        this.seed(seed);
    }

    seed(s) {
        this.a = s >>> 0;
        // Simple string hash if seed is not a number
        if (typeof s === 'string') {
            let hash = 1779033703 ^ s.length;
            for (let i = 0; i < s.length; i++) {
                hash = Math.imul(hash ^ s.charCodeAt(i), 3432918353);
                hash = hash << 13 | hash >>> 19;
            }
            this.a = hash >>> 0;
        }
        if (this.a === 0) {
            this.a = 0xDEADBEEF; // Avoid seed of 0
        }
    }

    // Returns a float [0, 1)
    random() {
        this.a ^= this.a << 13;
        this.a ^= this.a >> 17;
        this.a ^= this.a << 5;
        return (this.a >>> 0) / 4294967296;
    }

    // Returns a float from a standard normal distribution
    // (Box-Muller transform)
    gaussian() {
        let u1 = 0, u2 = 0;
        while (u1 === 0) u1 = this.random(); // Exclude 0
        u2 = this.random();
        
        const R = Math.sqrt(-2.0 * Math.log(u1));
        const T = 2.0 * Math.PI * u2;
        return R * Math.cos(T); // Can also return R * Math.sin(T) for a second independent value
    }
}

/**
 * (Spec 6, 15) Substance Database. MVP uses Water.
 */
const Substances = {
    water: {
        name: "Water",
        T_m: 0.0,      // °C
        T_b: 100.0,    // °C
        c_solid: 2100, // J/kg·K (ice)
        c_liquid: 4182, // J/kg·K (water)
        c_gas: 1996,   // J/kg·K (steam)
        L_f: 334000,   // J/kg (Latent Heat of Fusion)
        L_v: 2256000,  // J/kg (Latent Heat of Vaporization)
        density_liquid: 1000, // kg/m^3
    }
    // Future: Add Ethanol, Benzoic Acid, etc.
};

/**
 * (Spec 9) Logs simulation data and generates CSV.
 */
class DataLogger {
    constructor() {
        this.data = [];
        this.metadata = {};
        this.header = [
            "time_s", "heater_power_W", "heat_input_J_step", "cumulative_heat_J",
            "temp_true_C", "temp_measured_C", "phase", "mass_kg",
            "melted_mass_kg", "boiled_mass_kg", "heat_loss_W", "instrument_id", "seed"
        ].join(',');
    }

    setMetadata(metadata) {
        this.metadata = metadata;
    }

    addEntry(entry) {
        this.data.push(entry);
    }

    clear() {
        this.data = [];
    }

    generateCSV() {
        let csv = "";
        // Add metadata header (Spec 9)
        csv += `# Virtual Lab Export\n`;
        csv += `# Date: ${new Date().toISOString()}\n`;
        for (const [key, value] of Object.entries(this.metadata)) {
            csv += `# ${key}: ${value}\n`;
        }
        csv += "\n" + this.header + "\n";

        // Add data rows
        csv += this.data.map(row => [
            row.time_s.toFixed(2),
            row.heater_power_W.toFixed(2),
            row.heat_input_J_step.toFixed(3),
            row.cumulative_heat_J.toFixed(2),
            row.temp_true_C.toFixed(3),
            row.temp_measured_C.toFixed(2),
            row.phase,
            row.mass_kg.toFixed(4),
            row.melted_mass_kg.toFixed(4),
            row.boiled_mass_kg.toFixed(4),
            row.heat_loss_W.toFixed(2),
            row.instrument_id,
            row.seed
        ].join(',')).join('\n');
        
        return csv;
    }
}

/**
 * (Spec 5) Models a realistic instrument with noise and lag.
 */
class InstrumentModel {
    constructor(type, rng) {
        this.rng = rng;
        this.type = type;
        this.measuredValue_C = -10.0; // Initial value

        // (Spec 5, 15) Properties for different instruments
        if (type === 'digital') {
            this.sigma = 0.1; // Noise standard deviation (°C)
            this.tau = 1.5;   // Time constant (s)
            this.resolution = 0.1; // °C
        } else if (type === 'thermocouple') {
            this.sigma = 0.05;
            this.tau = 0.2; // Much faster
            this.resolution = 0.01;
        } else {
            this.sigma = 0.5;
            this.tau = 3.0; // Slow, cheap
            this.resolution = 0.5;
        }
    }
    
    reset(initialTemp) {
        this.measuredValue_C = initialTemp;
    }

    measure(trueValue_C, dt) {
        // (Spec 5) Model first-order lag: dT_meas/dt = (T_true - T_meas) / tau
        const dT_lag = (trueValue_C - this.measuredValue_C) / this.tau * dt;
        this.measuredValue_C += dT_lag;

        // (Spec 5) Add random (Gaussian) noise
        const noise = this.rng.gaussian() * this.sigma;
        let finalValue = this.measuredValue_C + noise;
        
        // (Spec 5) Apply instrument resolution
        finalValue = Math.round(finalValue / this.resolution) * this.resolution;

        return finalValue;
    }
}

/**
 * (Spec 4, 13) The core physics simulation engine.
 */
class PhysicsEngine {
    constructor(substance, seed) {
        this.rng = new XORShift(seed);
        this.seed = seed;
        this.substance = substance;
        this.logger = new DataLogger();
        this.initInstruments();
        this.reset();
    }

    initInstruments() {
        // (Spec 15) Create the two required instrument models
        this.instruments = {
            'digital': new InstrumentModel('digital', this.rng),
            'thermocouple': new InstrumentModel('thermocouple', this.rng),
        };
    }
    
    reset(newSeed) {
        if (newSeed !== undefined) {
            this.seed = newSeed;
            this.rng.seed(newSeed);
        }
        
        // Initial simulation state
        this.time_s = 0;
        this.T_true_C = -10.0; // Start as solid ice
        this.phase = 'solid'; // 'solid', 'solid+liquid', 'liquid', 'liquid+gas', 'gas'
        this.mass_kg = 0.050; // Default 50g
        this.melted_mass_kg = 0;
        this.boiled_mass_kg = 0;
        this.cumulative_heat_J = 0;
        
        // Reset instruments to initial temp
        Object.values(this.instruments).forEach(inst => inst.reset(this.T_true_C));
        this.logger.clear();
    }
    
    // (Spec 4, 13) Main simulation step
    step(dt, P_applied, hA, T_ambient, mass_kg, instrument_id) {
        this.mass_kg = mass_kg;
        const { T_m, T_b, c_solid, c_liquid, c_gas, L_f, L_v } = this.substance;

        // --- 1. Calculate Heat Flow ---
        // (Spec 5) Heat source variability
        const P_noise = (this.rng.random() - 0.5) * 0.05 * P_applied; // ±2.5% variability
        const P_actual = P_applied + P_noise;
        
        const Q_in = P_actual * dt;
        
        // (Spec 4) Heat loss
        const Q_loss = hA * (this.T_true_C - T_ambient) * dt;
        const Q_net = Q_in - Q_loss;
        const heat_loss_W = Q_loss / dt;

        this.cumulative_heat_J += Q_in;

        // --- 2. Update Temperature & Phase (State Machine) ---
        // (Spec 13 Pseudocode)
        
        // --- SOLID PHASE ---
        if (this.phase === 'solid') {
            const Q_to_raise_T = Q_net;
            const deltaT = Q_to_raise_T / (this.mass_kg * c_solid);

            if (this.T_true_C + deltaT < T_m) {
                // Stays solid
                this.T_true_C += deltaT;
            } else {
                // Hits melting point
                const Q_to_reach_Tm = (T_m - this.T_true_C) * this.mass_kg * c_solid;
                const Q_remaining_for_melt = Q_to_raise_T - Q_to_reach_Tm;
                
                this.T_true_C = T_m;
                this.phase = 'solid+liquid';
                this.processMelting(Q_remaining_for_melt); // Handle melting with remaining energy
            }
        } 
        // --- MELTING PHASE ---
        else if (this.phase === 'solid+liquid') {
            this.T_true_C = T_m; // Pin temperature during phase change
            this.processMelting(Q_net);
        }
        // --- LIQUID PHASE ---
        else if (this.phase === 'liquid') {
            const Q_to_raise_T = Q_net;
            const deltaT = Q_to_raise_T / (this.mass_kg * c_liquid);

            if (this.T_true_C + deltaT < T_b) {
                // Stays liquid
                this.T_true_C += deltaT;
            } else {
                // Hits boiling point
                const Q_to_reach_Tb = (T_b - this.T_true_C) * this.mass_kg * c_liquid;
                const Q_remaining_for_boil = Q_to_raise_T - Q_to_reach_Tb;
                
                this.T_true_C = T_b;
                this.phase = 'liquid+gas';
                this.processBoiling(Q_remaining_for_boil);
            }
        }
        // --- BOILING PHASE ---
        else if (this.phase === 'liquid+gas') {
            this.T_true_C = T_b; // Pin temperature
            this.processBoiling(Q_net);
        }
        // --- GAS PHASE ---
        else if (this.phase === 'gas') {
            const Q_to_raise_T = Q_net;
            const deltaT = Q_to_raise_T / (this.mass_kg * c_gas);
            this.T_true_C += deltaT;
        }

        // --- 3. Get Measurement ---
        const activeInstrument = this.instruments[instrument_id];
        const T_measured = activeInstrument.measure(this.T_true_C, dt);

        // --- 4. Log Data (Spec 9) ---
        const logEntry = {
            time_s: this.time_s,
            heater_power_W: P_actual,
            heat_input_J_step: Q_in,
            cumulative_heat_J: this.cumulative_heat_J,
            temp_true_C: this.T_true_C,
            temp_measured_C: T_measured,
            phase: this.phase,
            mass_kg: this.mass_kg,
            melted_mass_kg: this.melted_mass_kg,
            boiled_mass_kg: this.boiled_mass_kg,
            heat_loss_W: heat_loss_W,
            instrument_id: instrument_id,
            seed: this.seed
        };
        this.logger.addEntry(logEntry);
        
        // --- 5. Advance Time ---
        this.time_s += dt;

        return this.getState();
    }
    
    // Helper for melting logic
    processMelting(Q_available) {
        if (Q_available <= 0) return; // Don't melt if net heat is negative
        
        const mass_yet_to_melt = this.mass_kg - this.melted_mass_kg;
        const Q_to_melt_all = mass_yet_to_melt * this.substance.L_f;
        
        if (Q_available < Q_to_melt_all) {
            // Partially melts
            const mass_melted_this_step = Q_available / this.substance.L_f;
            this.melted_mass_kg += mass_melted_this_step;
        } else {
            // Finishes melting
            const Q_used_for_melt = Q_to_melt_all;
            const Q_remaining_for_liquid = Q_available - Q_used_for_melt;
            
            this.melted_mass_kg = this.mass_kg;
            this.phase = 'liquid';
            
            // Apply remaining heat to liquid phase in the *same* step
            const deltaT = Q_remaining_for_liquid / (this.mass_kg * this.substance.c_liquid);
            this.T_true_C = this.substance.T_m + deltaT; // Start above T_m
        }
    }
    
    // Helper for boiling logic
    processBoiling(Q_available) {
        if (Q_available <= 0) return;
        
        const mass_yet_to_boil = this.mass_kg - this.boiled_mass_kg;
        const Q_to_boil_all = mass_yet_to_boil * this.substance.L_v;
        
        if (Q_available < Q_to_boil_all) {
            // Partially boils
            const mass_boiled_this_step = Q_available / this.substance.L_v;
            this.boiled_mass_kg += mass_boiled_this_step;
        } else {
            // Finishes boiling
            const Q_used_for_boil = Q_to_boil_all;
            const Q_remaining_for_gas = Q_available - Q_used_for_boil;
            
            this.boiled_mass_kg = this.mass_kg;
            this.phase = 'gas';

            // Apply remaining heat to gas phase
            const deltaT = Q_remaining_for_gas / (this.mass_kg * this.substance.c_gas);
            this.T_true_C = this.substance.T_b + deltaT; // Start above T_b
        }
    }

    // Returns a snapshot of the current state for the UI
    getState() {
        const lastEntry = this.logger.data[this.logger.data.length - 1] || {};
        return {
            time: this.time_s,
            T_true: this.T_true_C,
            T_measured: lastEntry.temp_measured_C || this.T_true_C,
            phase: this.phase,
            melt_fraction: this.mass_kg > 0 ? this.melted_mass_kg / this.mass_kg : 0,
            boil_fraction: this.mass_kg > 0 ? this.boiled_mass_kg / this.mass_kg : 0,
            logEntry: lastEntry
        };
    }
}


// --- REACT COMPONENTS ---

/**
 * (Spec 8) Left Panel: Simulation Controls
 */
function Controls({ settings, setSettings, onStart, onStop, onReset, isRunning }) {
    
    const handleChange = (e) => {
        const { name, value, type } = e.target;
        setSettings(prev => ({
            ...prev,
            [name]: type === 'number' ? parseFloat(value) : value
        }));
    };
    
    const handleSeedChange = (e) => {
         setSettings(prev => ({
            ...prev,
            seed: e.target.value
        }));
    }

    return (
        <div className="panel left-panel">
            <h2>🧪 Controls</h2>
            
            <div className="button-group">
                <button className="start" onClick={onStart} disabled={isRunning}>Start</button>
                <button className="stop" onClick={onStop} disabled={!isRunning}>Stop</button>
                <button className="reset" onClick={onReset} disabled={isRunning}>Reset</button>
            </div>
            
            <h3>Simulation Setup</h3>
            <div className="control-group">
                <label htmlFor="seed">RNG Seed (Spec 11, 15)</label>
                <input
                    type="text"
                    id="seed"
                    name="seed"
                    value={settings.seed}
                    onChange={handleSeedChange}
                    disabled={isRunning}
                />
            </div>
            <div className="control-group">
                <label htmlFor="mass">Sample Mass (g) [5g - 200g]</label>
                <input
                    type="range"
                    id="mass"
                    name="mass"
                    min="5"
                    max="200"
                    step="5"
                    value={settings.mass}
                    onChange={handleChange}
                    disabled={isRunning}
                />
                <span>{settings.mass} g</span>
            </div>
            <div className="control-group">
                <label htmlFor="power">Heater Power (W) [0W - 500W]</label>
                <input
                    type="range"
                    id="power"
                    name="power"
                    min="0"
                    max="500"
                    step="10"
                    value={settings.power}
                    onChange={handleChange}
                />
                <span>{settings.power} W</span>
            </div>
            
            <h3>Environment & Equipment</h3>
            <div className="control-group">
                <label htmlFor="instrument">Instrument (Spec 15)</label>
                <select 
                    id="instrument" 
                    name="instrument" 
                    value={settings.instrument} 
                    onChange={handleChange}
                    disabled={isRunning}
                >
                    <option value="digital">Digital (±0.1°C, 1.5s lag)</option>
                    <option value="thermocouple">Thermocouple (±0.05°C, 0.2s lag)</option>
                </select>
            </div>
            <div className="control-group">
                <label htmlFor="insulation">Insulation Level (Heat Loss)</label>
                <select 
                    id="insulation" 
                    name="insulation" 
                    value={settings.insulation} 
                    onChange={handleChange}
                >
                    <option value="0.5">None (High Loss)</option>
                    <option value="0.2">Foam (Medium Loss)</option>
                    <option value="0.05">Vacuum (Low Loss)</option>
                </select>
            </div>
             <div className="control-group">
                <label htmlFor="T_ambient">Ambient Temp (°C)</label>
                <input
                    type="number"
                    id="T_ambient"
                    name="T_ambient"
                    min="-20"
                    max="40"
                    step="1"
                    value={settings.T_ambient}
                    onChange={handleChange}
                />
            </div>
        </div>
    );
}

/**
 * (Spec 8) Center Panel: Macroscopic Visualization
 */
function MacroView({ simState }) {
    const canvasRef = useRef(null);
    const { phase, T_true, T_measured, melt_fraction, boil_fraction } = simState || {};

    useEffect(() => {
        if (!canvasRef.current || !simState) return;
        
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        
        // Clear canvas
        ctx.fillStyle = '#f4f4f4';
        ctx.fillRect(0, 0, w, h);
        
        // --- Draw Beaker ---
        const beakerW = w * 0.6;
        const beakerH = h * 0.8;
        const beakerX = (w - beakerW) / 2;
        const beakerY = h * 0.1;
        const beakerBottom = beakerY + beakerH;
        
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(beakerX, beakerY);
        ctx.lineTo(beakerX, beakerBottom);
        ctx.lineTo(beakerX + beakerW, beakerBottom);
        ctx.lineTo(beakerX + beakerW, beakerY);
        ctx.stroke();
        
        // --- Draw Contents ---
        const contentH = beakerH * 0.8;
        const contentY = beakerBottom - contentH;
        const solidH = contentH * (1 - melt_fraction);
        const liquidH = contentH * (melt_fraction - boil_fraction);
        
        // Solid (Ice)
        if (solidH > 0) {
            ctx.fillStyle = 'rgba(173, 216, 230, 0.8)'; // Light blue
            ctx.fillRect(beakerX, contentY + liquidH, beakerW, solidH);
        }
        // Liquid (Water)
        if (liquidH > 0) {
            ctx.fillStyle = 'rgba(0, 100, 200, 0.7)'; // Blue
            ctx.fillRect(beakerX, contentY, beakerW, liquidH);
        }
        // Gas (Steam)
        if (boil_fraction > 0.01) {
            ctx.fillStyle = 'rgba(150, 150, 150, 0.4)';
            for (let i = 0; i < boil_fraction * 50; i++) {
                const bubbleX = beakerX + Math.random() * beakerW;
                const bubbleY = contentY - Math.random() * 20;
                ctx.beginPath();
                ctx.arc(bubbleX, bubbleY, Math.random() * 5 + 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // --- Draw Thermometer (Measured Temp) ---
        const thermoX = w * 0.85;
        const thermoTop = h * 0.1;
        const thermoBottom = h * 0.9;
        const thermoH = thermoBottom - thermoTop;
        
        ctx.fillStyle = '#666';
        ctx.fillRect(thermoX - 2, thermoTop, 4, thermoH); // Stem
        ctx.beginPath();
        ctx.arc(thermoX, thermoBottom + 5, 8, 0, Math.PI * 2); // Bulb
        ctx.fill();
        
        // Map temp (-20 to 120) to thermometer height
        const tempRange = 140; // -20 to 120
        const tempFrac = (T_measured - (-20)) / tempRange;
        const fillH = Math.max(0, Math.min(1, tempFrac)) * (thermoH - 10);
        
        ctx.fillStyle = '#dc3545'; // Red
        ctx.fillRect(thermoX - 2, thermoBottom - fillH, 4, fillH);
        ctx.beginPath();
        ctx.arc(thermoX, thermoBottom + 5, 6, 0, Math.PI * 2);
        ctx.fill();

    }, [simState]);
    
    return (
        <>
            <h3>Macroscopic View</h3>
            <canvas ref={canvasRef} className="vis-canvas" width="400" height="240"></canvas>
            <div className="data-readout">
                <p>Time: <strong>{simState?.time.toFixed(1) || 0} s</strong></p>
                <p>Phase: <strong>{simState?.phase || '...'}</strong></p>
                <p>True Temp: <strong>{simState?.T_true.toFixed(2) || 0} °C</strong></p>
                <p>Measured Temp: <strong>{simState?.T_measured.toFixed(1) || 0} °C</strong></p>
            </div>
        </>
    );
}

/**
 * (Spec 7, 15) Center Panel: Simplified Atomic Visualization
 */
function AtomicView({ simState }) {
    const canvasRef = useRef(null);
    const particlesRef = useRef([]);
    const animFrameRef = useRef(null);
    const { phase, T_true } = simState || { phase: 'solid', T_true: -10 };

    // Initialize particles
    useEffect(() => {
        const numParticles = 50;
        const canvas = canvasRef.current;
        const w = canvas.width;
        const h = canvas.height;
        const particles = [];
        
        // Create a grid for solid
        const grid_n = 7;
        const spacing = w / (grid_n + 1);
        for (let i = 1; i < grid_n; i++) {
            for (let j = 1; j < grid_n; j++) {
                if (particles.length >= numParticles) break;
                particles.push({
                    x: i * spacing + (Math.random()-0.5) * 5,
                    y: j * spacing + (Math.random()-0.5) * 5,
                    vx: 0,
                    vy: 0,
                    baseX: i * spacing,
                    baseY: j * spacing,
                });
            }
        }
        particlesRef.current = particles;
        
        // Cleanup animation frame
        return () => {
            if (animFrameRef.current) {
                cancelAnimationFrame(animFrameRef.current);
            }
        };
    }, []);

    // Animation loop
    useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        
        const T_kelvin = T_true + 273.15;
        // (Spec 7) Kinetic energy proxy, non-linear for better visual effect
        const ke_proxy = Math.pow(Math.max(0, T_kelvin), 1.5) / 1000;
        
        const loop = () => {
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, w, h);
            
            const particles = particlesRef.current;
            
            particles.forEach(p => {
                let forceX = 0;
                let forceY = 0;

                if (phase === 'solid' || phase === 'solid+liquid') {
                    // (Spec 7) Vibrate around grid point
                    const vibr_amplitude = Math.min(10, ke_proxy * 0.5);
                    forceX = (p.baseX - p.x) * 0.1 + (Math.random() - 0.5) * vibr_amplitude;
                    forceY = (p.baseY - p.y) * 0.1 + (Math.random() - 0.5) * vibr_amplitude;
                    p.vx *= 0.8; // Damping
                    p.vy *= 0.8;
                } 
                else if (phase === 'liquid' || phase === 'liquid+gas') {
                    // (Spec 7) Free diffusion
                    const move_amplitude = Math.min(15, ke_proxy * 0.3);
                    forceX = (Math.random() - 0.5) * move_amplitude;
                    forceY = (Math.random() - 0.5) * move_amplitude;
                    
                    if (phase === 'liquid+gas' || phase === 'gas') {
                         forceY -= ke_proxy * 0.05; // Bias upwards for gas
                    }
                    
                    p.vx *= 0.95; // Liquid drag
                    p.vy *= 0.95;
                }
                
                if (phase === 'gas') {
                     // High velocity, less damping
                    const move_amplitude = Math.min(25, ke_proxy * 0.5);
                    forceX = (Math.random() - 0.5) * move_amplitude;
                    forceY = (Math.random() - 0.5) * move_amplitude;
                    p.vx *= 0.99;
                    p.vy *= 0.99;
                }

                // Update velocity & position (Verlet-like)
                p.vx += forceX;
                p.vy += forceY;
                p.x += p.vx * 0.1;
                p.y += p.vy * 0.1;

                // Wall collisions
                if (p.x < 5 || p.x > w - 5) { p.vx *= -0.5; p.x = Math.max(5, Math.min(w - 5, p.x)); }
                
                // Gas fills volume, liquid/solid stays at bottom
                const floor = (phase === 'gas') ? h - 5 : p.baseY + h*0.2;
                if (p.y < 5) { p.vy *= -0.5; p.y = 5; }
                if (p.y > h-5) { p.vy *= -0.5; p.y = h-5; }


                // Draw particle
                // (Spec 7) Color-coded by kinetic energy (simplified)
                const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
                const r = 50 + Math.min(205, speed * 20);
                const g = 100 - Math.min(100, speed * 10);
                const b = 255 - Math.min(200, speed * 20);
                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            
            animFrameRef.current = requestAnimationFrame(loop);
        };
        
        // Start loop
        animFrameRef.current = requestAnimationFrame(loop);
        
        // Stop loop on cleanup
        return () => {
            if (animFrameRef.current) {
                cancelAnimationFrame(animFrameRef.current);
            }
        };
    }, [phase, T_true]); // Re-trigger loop logic if phase/temp changes significantly
    
    return (
        <>
            <h3>Atomic-Scale View (Simplified)</h3>
            <canvas ref={canvasRef} className="atomic-canvas" width="400" height="240"></canvas>
        </>
    );
}

/**
 * (Spec 8) Right Panel: Live Graph
 */
function GraphView({ logger, graphType }) {
    const canvasRef = useRef(null);
    const chartRef = useRef(null);

    useEffect(() => {
        if (!canvasRef.current) return;
        
        const ctx = canvasRef.current.getContext('2d');
        
        // Destroy old chart instance
        if (chartRef.current) {
            chartRef.current.destroy();
        }
        
        // Determine x-axis label and data
        let xAxisLabel, xAxisData;
        if (graphType === 'time') {
            xAxisLabel = 'Time (s)';
            xAxisData = logger.data.map(d => d.time_s);
        } else {
            xAxisLabel = 'Cumulative Heat Added (kJ)';
            xAxisData = logger.data.map(d => d.cumulative_heat_J / 1000);
        }

        // Create new chart
        chartRef.current = new Chart(ctx, {
            type: 'line',
            data: {
                labels: xAxisData,
                datasets: [
                    {
                        label: 'Measured Temp (°C)',
                        data: logger.data.map(d => d.temp_measured_C),
                        borderColor: 'rgba(220, 53, 69, 0.8)', // Red
                        backgroundColor: 'rgba(220, 53, 69, 0.2)',
                        borderWidth: 2,
                        pointRadius: 0,
                    },
                    {
                        label: 'True Temp (°C)',
                        data: logger.data.map(d => d.temp_true_C),
                        borderColor: 'rgba(0, 123, 255, 0.8)', // Blue
                        backgroundColor: 'rgba(0, 123, 255, 0.2)',
                        borderWidth: 2,
                        pointRadius: 0,
                        borderDash: [5, 5], // Dashed line
                    }
                ]
            },
            options: {
                animation: false,
                scales: {
                    x: {
                        title: { display: true, text: xAxisLabel }
                    },
                    y: {
                        title: { display: true, text: 'Temperature (°C)' }
                    }
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Temperature vs. ' + (graphType === 'time' ? 'Time' : 'Heat Added')
                    }
                }
            }
        });
        
    }, [logger.data.length, graphType]); // Re-render only when data length changes or type changes
    
    return (
        <div className="graph-container">
            <canvas ref={canvasRef} width="400" height="300"></canvas>
        </div>
    );
}

/**
 * (Spec 9, 10, 15) Right Panel: Data & Analysis Controls
 */
function DataAndAnalysis({ logger, onDownloadCSV, onAnalyze, analysis, settings, onGraphTypeChange, graphType }) {
    return (
        <div className="data-tools">
            <h3>Data & Analysis</h3>
             <div className="control-group">
                <label htmlFor="graphType">Graph X-Axis (Spec 10)</label>
                <select 
                    id="graphType" 
                    name="graphType" 
                    value={graphType} 
                    onChange={e => onGraphTypeChange(e.target.value)}
                >
                    <option value="heat">Cumulative Heat (kJ)</option>
                    <option value="time">Time (s)</option>
                </select>
            </div>
            <div className="button-group">
                <button onClick={onAnalyze} style={{backgroundColor: '#17a2b8', color: 'white'}}>Analyze (Spec 15)</button>
                <button onClick={onDownloadCSV} style={{backgroundColor: '#6c757d', color: 'white'}}>Download CSV (Spec 9)</button>
            </div>
            
            {analysis && (
                <div className="analysis-results">
                    <h4>Analysis Results:</h4>
                    <p>Substance: {analysis.substance}</p>
                    <p>Mass: {analysis.mass_kg * 1000} g</p>
                    <hr />
                    <p><b>Specific Heat (Solid):</b></p>
                    <p>Measured: <strong>{analysis.c_solid_measured.toFixed(0)}</strong> J/kg·K</p>
                    <p>Actual: {analysis.c_solid_actual} J/kg·K</p>
                    <p>Error: {analysis.c_solid_error.toFixed(1)}%</p>
                    <hr />
                    <p><b>Latent Heat (Fusion):</b></p>
                    <p>Measured: <strong>{analysis.Lf_measured.toFixed(0)}</strong> J/kg</p>
                    <p>Actual: {analysis.Lf_actual} J/kg</p>
                    <p>Error: {analysis.Lf_error.toFixed(1)}%</p>
                </div>
            )}
        </div>
    );
}


/**
 * (Spec 8) Main Application Component
 */
function App() {
    // --- State ---
    const [settings, setSettings] = useState({
        seed: 12345,
        mass: 50.0, // in grams
        power: 100.0, // in Watts
        instrument: 'digital',
        insulation: '0.2', // hA coefficient
        T_ambient: 20.0,
    });
    
    const [simState, setSimState] = useState(null);
    const [isRunning, setIsRunning] = useState(false);
    const [graphType, setGraphType] = useState('heat'); // 'time' or 'heat'
    const [analysis, setAnalysis] = useState(null);

    // --- Refs ---
    // (Spec 15) Use memo to init engine once, respecting seed control
    const engine = useMemo(() => {
        console.log("Initializing Physics Engine with seed:", settings.seed);
        const substance = Substances.water;
        const eng = new PhysicsEngine(substance, settings.seed);
        
        // Set logger metadata
        eng.logger.setMetadata({
            substance: substance.name,
            seed: settings.seed,
            instrument: settings.instrument,
            initial_mass_g: settings.mass,
            ambient_temp_C: settings.T_ambient,
        });
        
        return eng;
    }, [settings.seed]); // Only re-create engine if seed changes
    
    const animFrame = useRef(null);

    // --- Effects ---
    // Initialize simState on mount
    useEffect(() => {
        setSimState(engine.getState());
    }, [engine]);
    
    // The main simulation loop (Spec 13)
    const runSimulationStep = useCallback(() => {
        if (!isRunning) return;
        
        // (Spec 4) Use a stable sim timestep (dt)
        const sim_dt = 0.1; // 100ms simulation step
        const hA = parseFloat(settings.insulation);
        const mass_kg = settings.mass / 1000.0;
        
        const newState = engine.step(
            sim_dt, 
            settings.power, 
            hA, 
            settings.T_ambient, 
            mass_kg, 
            settings.instrument
        );
        
        setSimState(newState); // This triggers UI re-render
        
        animFrame.current = requestAnimationFrame(runSimulationStep);
    }, [isRunning, engine, settings]); // Re-create callback if settings change

    // Start/Stop the simulation loop
    useEffect(() => {
        if (isRunning) {
            animFrame.current = requestAnimationFrame(runSimulationStep);
        } else {
            if (animFrame.current) {
                cancelAnimationFrame(animFrame.current);
            }
        }
        
        // Cleanup
        return () => {
            if (animFrame.current) {
                cancelAnimationFrame(animFrame.current);
            }
        };
    }, [isRunning, runSimulationStep]);
    
    // Update logger metadata if settings change *while paused*
    useEffect(() => {
        if (!isRunning) {
            engine.logger.setMetadata({
                substance: engine.substance.name,
                seed: settings.seed,
                instrument: settings.instrument,
                initial_mass_g: settings.mass,
                ambient_temp_C: settings.T_ambient,
            });
        }
    }, [settings, isRunning, engine]);


    // --- Event Handlers ---
    const handleStart = () => {
        setAnalysis(null); // Clear old analysis
        setIsRunning(true);
    };
    
    const handleStop = () => {
        setIsRunning(false);
    };
    
    const handleReset = () => {
        setIsRunning(false);
        setAnalysis(null);
        engine.reset(settings.seed); // (Spec 11) Reset with current seed
        setSimState(engine.getState());
    };
    
    const handleDownloadCSV = () => {
        const csv = engine.logger.generateCSV();
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `lab_data_seed_${settings.seed}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };
    
    // (Spec 10, 15) Built-in data analysis
    const handleAnalyze = () => {
        if (isRunning) handleStop();
        
        const data = engine.logger.data;
        if (data.length < 50) {
            alert("Not enough data to analyze. Run the simulation longer.");
            return;
        }
        
        const { c_solid, L_f } = engine.substance;
        const mass_kg = data[0].mass_kg;
        
        // 1. Find Specific Heat (c_solid)
        // (Spec 10) Linear fit to pre-plateau region (T vs Q)
        const solidData = data.filter(d => d.phase === 'solid' && d.temp_true_C < -2.0);
        let c_solid_measured = NaN;
        if (solidData.length > 10) {
            const first = solidData[0];
            const last = solidData[solidData.length - 1];
            const dQ = last.cumulative_heat_J - first.cumulative_heat_J;
            const dT = last.temp_true_C - first.temp_true_C;
            
            // c = (dQ/dT) / m
            if (dT > 0) {
                const slope = dQ / dT;
                c_solid_measured = slope / mass_kg;
            }
        }
        
        // 2. Find Latent Heat (L_f)
        const meltingData = data.filter(d => d.phase === 'solid+liquid');
        let Lf_measured = NaN;
        if (meltingData.length > 10) {
            const Q_start = meltingData[0].cumulative_heat_J;
            const Q_end = meltingData[meltingData.length - 1].cumulative_heat_J;
            const dQ_melt = Q_end - Q_start;
            
            // Lf = dQ_melt / m
            Lf_measured = dQ_melt / mass_kg;
        }

        setAnalysis({
            substance: engine.substance.name,
            mass_kg: mass_kg,
            c_solid_measured: c_solid_measured,
            c_solid_actual: c_solid,
            c_solid_error: (c_solid_measured - c_solid) / c_solid * 100,
            Lf_measured: Lf_measured,
            Lf_actual: L_f,
            Lf_error: (Lf_measured - L_f) / L_f * 100
        });
    };

    // --- Render ---
    return (
        <div className="app-container">
            <Controls 
                settings={settings} 
                setSettings={setSettings}
                onStart={handleStart}
                onStop={handleStop}
                onReset={handleReset}
                isRunning={isRunning}
            />
            
            <div className="panel center-panel">
                {simState && <MacroView simState={simState} />}
                {simState && <AtomicView simState={simState} />}
            </div>
            
            <div className="panel right-panel">
                <h2>📊 Data & Analysis</h2>
                <DataAndAnalysis 
                    logger={engine.logger}
                    onDownloadCSV={handleDownloadCSV}
                    onAnalyze={handleAnalyze}
                    analysis={analysis}
                    settings={settings}
                    onGraphTypeChange={setGraphType}
                    graphType={graphType}
                />
                <GraphView 
                    logger={engine.logger} 
                    graphType={graphType}
                />
            </div>
        </div>
    );
}

// --- Mount the Application ---
const rootElement = document.getElementById('root');
const root = createRoot(rootElement);
root.render(<App />);

    </script>
