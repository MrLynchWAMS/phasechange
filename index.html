<body>
  <div id="root"></div>

  <script type="text/babel">
    "use strict";

    const { useState, useEffect, useRef, useMemo } = React;
    const { createRoot } = ReactDOM;
    const ChartJS = window.Chart;

    // --- UTILITIES ---
    class XORShift {
      constructor(seed) {
        this.seed(seed);
      }
      seed(s) {
        this.a = s >>> 0;
        if (typeof s === "string") {
          let hash = 1779033703 ^ s.length;
          for (let i = 0; i < s.length; i++) {
            hash = Math.imul(hash ^ s.charCodeAt(i), 3432918353);
            hash = (hash << 13) | (hash >>> 19);
          }
          this.a = hash >>> 0;
        }
        if (this.a === 0) this.a = 0xdeadbeef;
      }
      random() {
        this.a ^= this.a << 13;
        this.a ^= this.a >>> 17;
        this.a ^= this.a << 5;
        return (this.a >>> 0) / 4294967296;
      }
      gaussian() {
        let u1 = 0,
          u2 = 0;
        while (u1 === 0) u1 = this.random();
        u2 = this.random();
        const R = Math.sqrt(-2.0 * Math.log(u1));
        const T = 2.0 * Math.PI * u2;
        return R * Math.cos(T);
      }
    }

    // Substance database (educational values; some are approximations)
    const Substances = {
      water: {
        key: "water",
        name: "Water",
        T_m: 0.0,
        T_b: 100.0,
        c_solid: 2100,
        c_liquid: 4182,
        c_gas: 1996,
        L_f: 334000,
        L_v: 2256000,
        density_liquid: 1000,
        density_solid: 917, // Ice floats in water
        solidFloats: true
      },
      ethanol: {
        key: "ethanol",
        name: "Ethanol",
        T_m: -114.1,
        T_b: 78.37,
        c_solid: 1700,
        c_liquid: 2440,
        c_gas: 1600,
        L_f: 108000,
        L_v: 846000,
        density_liquid: 789,
        density_solid: 828, // 1.05 * density_liquid
        solidFloats: false
      },
      acetone: {
        key: "acetone",
        name: "Acetone",
        T_m: -94.7,
        T_b: 56.05,
        c_solid: 1700,
        c_liquid: 2150,
        c_gas: 1200,
        L_f: 100000,
        L_v: 518000,
        density_liquid: 785,
        density_solid: 824, // 1.05 * density_liquid
        solidFloats: false
      },
      mercury: {
        key: "mercury",
        name: "Mercury",
        T_m: -38.83,
        T_b: 356.73,
        c_solid: 140,
        c_liquid: 140,
        c_gas: 140,
        L_f: 11400,
        L_v: 294000,
        density_liquid: 13595,
        density_solid: 14275, // 1.05 * density_liquid
        solidFloats: false
      },
      gallium: {
        key: "gallium",
        name: "Gallium",
        T_m: 29.76,
        T_b: 2400,
        c_solid: 370,
        c_liquid: 370,
        c_gas: 350,
        L_f: 80000,
        L_v: 2560000,
        density_liquid: 6095,
        density_solid: 5910, // Gallium expands when freezing (like water/ice)
        solidFloats: true
      },
      sodium_chloride: {
        key: "sodium_chloride",
        name: "Sodium Chloride",
        T_m: 801,
        T_b: 1413,
        c_solid: 850,
        c_liquid: 1200,
        c_gas: 800,
        L_f: 492000,
        L_v: 4770000,
        density_liquid: 1500,
        density_solid: 1575, // 1.05 * density_liquid
        solidFloats: false
      },
      butter: {
        key: "butter",
        name: "Butter",
        T_m: 33, // softens/melts in low 30s °C
        T_b: 300, // placeholder; decomposes rather than cleanly boiling
        c_solid: 2100,
        c_liquid: 2200,
        c_gas: 1500,
        L_f: 180000,
        L_v: 700000,
        density_liquid: 911,
        density_solid: 957, // 1.05 * density_liquid
        solidFloats: false
      }
    };

    // Data logger (CSV unchanged; we only trim on-screen)
    class DataLogger {
      constructor() {
        this.data = [];
        this.metadata = {};
        this.header = [
          "time_s",
          "heater_power_W",
          "heat_input_J_step",
          "cumulative_heat_J",
          "temp_true_C",
          "temp_measured_C",
          "phase",
          "mass_kg",
          "melted_mass_kg",
          "boiled_mass_kg",
          "heat_loss_W",
          "instrument_id",
          "seed"
        ].join(",");
      }
      setMetadata(m) {
        this.metadata = m;
      }
      addEntry(e) {
        this.data.push(e);
      }
      clear() {
        this.data = [];
      }
      generateCSV() {
        let csv = "";
        csv += `# Virtual Lab Export\n`;
        csv += `# Date: ${new Date().toISOString()}\n`;
        for (const [k, v] of Object.entries(this.metadata))
          csv += `# ${k}: ${v}\n`;
        csv += "\n" + this.header + "\n";
        csv += this.data
          .map((row) =>
            [
              row.time_s.toFixed(2),
              row.heater_power_W.toFixed(2),
              row.heat_input_J_step.toFixed(3),
              row.cumulative_heat_J.toFixed(2),
              row.temp_true_C.toFixed(2),
              row.temp_measured_C.toFixed(1),
              row.phase,
              row.mass_kg.toFixed(4),
              row.melted_mass_kg.toFixed(4),
              row.boiled_mass_kg.toFixed(4),
              row.heat_loss_W.toFixed(2),
              row.instrument_id,
              row.seed
            ].join(",")
          )
          .join("\n");
        return csv;
      }
    }

    // Instrument model
    class InstrumentModel {
      constructor(type, rng) {
        this.rng = rng;
        this.type = type;
        this.measuredValue_C = -10.0;
        if (type === "digital") {
          this.sigma = 0.08;
          this.tau = 1.2;
          this.resolution = 0.1;
        } else if (type === "thermocouple") {
          this.sigma = 0.03;
          this.tau = 0.25;
          this.resolution = 0.05;
        } else {
          this.sigma = 0.4;
          this.tau = 2.5;
          this.resolution = 0.5;
        }
      }
      reset(initialTemp) {
        this.measuredValue_C = initialTemp;
      }
      measure(trueValue_C, dt) {
        const dT_lag = ((trueValue_C - this.measuredValue_C) / this.tau) * dt;
        this.measuredValue_C += dT_lag;
        const noise = this.rng.gaussian() * this.sigma;
        let finalValue = this.measuredValue_C + noise;
        finalValue = Math.round(finalValue / this.resolution) * this.resolution;
        return finalValue;
      }
    }

    // Physics engine
    class PhysicsEngine {
      constructor(substance, seed) {
        this.rng = new XORShift(seed || 12345);
        this.seed = seed || 12345;
        this.substance = substance;
        this.logger = new DataLogger();
        this.instruments = {
          digital: new InstrumentModel("digital", this.rng),
          thermocouple: new InstrumentModel("thermocouple", this.rng)
        };
        // Teacher controls
        this.idealizedLinearLiquid = false; // Default off; makes liquid heating near-linear
        this.pressure_kPa = 101.3; // Default atmospheric pressure
        this.reset();
      }
      setSubstance(substance) {
        this.substance = substance;
      }
      reset(newSeed) {
        if (newSeed !== undefined && newSeed !== null && newSeed !== "") {
          this.seed = newSeed;
          this.rng.seed(newSeed);
        }
        this.time_s = 0;
        this.T_true_C = -10.0;
        this.phase = "solid";
        this.mass_kg = 0.05;
        this.melted_mass_kg = 0;
        this.boiled_mass_kg = 0;
        this.cumulative_heat_J = 0;
        Object.values(this.instruments).forEach((i) => i.reset(this.T_true_C));
        this.logger.clear();
      }
      step(dt, P_applied, hA, T_ambient, mass_kg, instrument_id) {
        this.mass_kg = mass_kg;
        let { T_m, T_b, c_solid, c_liquid, c_gas } = this.substance;

        // Dynamic boiling point for water based on pressure (Antoine equation)
        if (this.substance.key === "water" && this.pressure_kPa !== 101.3) {
          const P_mmHg = this.pressure_kPa * 7.50062;
          const A = 8.07131, B = 1730.63, C = 233.426;
          T_b = B / (A - Math.log10(P_mmHg)) - C;
        }

        // Idealized liquid heating: remove jitter and reduce losses in liquid phase
        let P_noise = (this.rng.random() - 0.5) * 0.04 * P_applied;
        let hA_actual = hA;
        if (this.phase === "liquid" && this.idealizedLinearLiquid) {
          P_noise = 0; // Remove heater jitter
          hA_actual = hA * 0.05; // Scale heat losses to near zero for linear behavior
        }

        const P_actual = Math.max(0, P_applied + P_noise);
        const Q_in = P_actual * dt;
        const Q_loss = hA_actual * (this.T_true_C - T_ambient) * dt;
        const Q_net = Q_in - Q_loss;
        const heat_loss_W = Q_loss / dt;
        this.cumulative_heat_J += Q_in;

        if (this.phase === "solid") {
          const deltaT = Q_net / (this.mass_kg * c_solid);
          if (this.T_true_C + deltaT < T_m) {
            this.T_true_C += deltaT;
          } else {
            const Q_to_reach_Tm =
              (T_m - this.T_true_C) * this.mass_kg * c_solid;
            const Q_remaining_for_melt = Q_net - Q_to_reach_Tm;
            this.T_true_C = T_m;
            this.phase = "solid+liquid";
            this.processMelting(Q_remaining_for_melt);
          }
        } else if (this.phase === "solid+liquid") {
          this.T_true_C = T_m;
          this.processMelting(Q_net);
        } else if (this.phase === "liquid") {
          const deltaT = Q_net / (this.mass_kg * c_liquid);
          if (this.T_true_C + deltaT < T_b) {
            this.T_true_C += deltaT;
          } else {
            const Q_to_reach_Tb =
              (T_b - this.T_true_C) * this.mass_kg * c_liquid;
            const Q_remaining_for_boil = Q_net - Q_to_reach_Tb;
            this.T_true_C = T_b;
            this.phase = "liquid+gas";
            this.processBoiling(Q_remaining_for_boil);
          }
        } else if (this.phase === "liquid+gas") {
          this.T_true_C = T_b;
          this.processBoiling(Q_net);
        } else if (this.phase === "gas") {
          const deltaT = Q_net / (this.mass_kg * c_gas);
          this.T_true_C += deltaT;
        }

        const activeInstrument =
          this.instruments[instrument_id] || this.instruments.digital;
        const T_measured = activeInstrument.measure(this.T_true_C, dt);
        const logEntry = {
          time_s: this.time_s,
          heater_power_W: P_actual,
          heat_input_J_step: Q_in,
          cumulative_heat_J: this.cumulative_heat_J,
          temp_true_C: this.T_true_C,
          temp_measured_C: T_measured,
          phase: this.phase,
          mass_kg: this.mass_kg,
          melted_mass_kg: this.melted_mass_kg,
          boiled_mass_kg: this.boiled_mass_kg,
          heat_loss_W: heat_loss_W,
          instrument_id: instrument_id,
          seed: this.seed
        };
        this.logger.addEntry(logEntry);
        this.time_s += dt;
        return this.getState();
      }
      processMelting(Q_available) {
        if (Q_available <= 0) return;
        const mass_yet_to_melt = this.mass_kg - this.melted_mass_kg;
        const Q_to_melt_all = mass_yet_to_melt * this.substance.L_f;
        if (Q_available < Q_to_melt_all) {
          this.melted_mass_kg += Q_available / this.substance.L_f;
        } else {
          const Q_remaining_for_liquid = Q_available - Q_to_melt_all;
          this.melted_mass_kg = this.mass_kg;
          this.phase = "liquid";
          this.T_true_C =
            this.substance.T_m +
            Q_remaining_for_liquid / (this.mass_kg * this.substance.c_liquid);
        }
      }
      processBoiling(Q_available) {
        if (Q_available <= 0) return;
        const mass_yet_to_boil = this.mass_kg - this.boiled_mass_kg;
        const Q_to_boil_all = mass_yet_to_boil * this.substance.L_v;
        if (Q_available < Q_to_boil_all) {
          this.boiled_mass_kg += Q_available / this.substance.L_v;
        } else {
          const Q_remaining_for_gas = Q_available - Q_to_boil_all;
          this.boiled_mass_kg = this.mass_kg;
          this.phase = "gas";
          this.T_true_C =
            this.substance.T_b +
            Q_remaining_for_gas / (this.mass_kg * this.substance.c_gas);
        }
      }
      getState() {
        const lastEntry = this.logger.data[this.logger.data.length - 1] || {};
        return {
          time: this.time_s,
          T_true: this.T_true_C,
          T_measured: lastEntry.temp_measured_C ?? this.T_true_C,
          phase: this.phase,
          melt_fraction:
            this.mass_kg > 0 ? this.melted_mass_kg / this.mass_kg : 0,
          boil_fraction:
            this.mass_kg > 0 ? this.boiled_mass_kg / this.mass_kg : 0,
          logEntry: lastEntry
        };
      }
    }

    // Exponential moving average for display calmness
    function useEMA(value, alpha = 0.2) {
      const [smoothed, setSmoothed] = useState(value);
      const ref = useRef(value);
      useEffect(() => {
        const next = alpha * value + (1 - alpha) * ref.current;
        ref.current = next;
        setSmoothed(next);
      }, [value, alpha]);
      return smoothed;
    }

    // Constants for macroscopic view density calculations
    const DEFAULT_SOLID_DENSITY_MULTIPLIER = 1.05; // Typical solid is 5% denser than liquid
    const BEAKER_VOLUME_TO_HEIGHT_SCALE = 1.5e6; // Calibrated factor to scale m³ to pixel height

    // --- REACT COMPONENTS ---
    function Controls({
      settings,
      setSettings,
      onStart,
      onStop,
      onReset,
      isRunning,
      solidFloats,
      hideSubstance
    }) {
      const handleChange = (e) => {
        const { name, value, type } = e.target;
        setSettings((prev) => ({
          ...prev,
          [name]: type === "number" || type === "range" ? parseFloat(value) : value
        }));
      };
      const handleSeedChange = (e) =>
        setSettings((prev) => ({ ...prev, seed: e.target.value }));

      return (
        <div className="panel left-panel">
          <h2>🧪 Controls</h2>
          <div className="button-group">
            <button className="start" onClick={onStart} disabled={isRunning}>
              Start
            </button>
            <button className="stop" onClick={onStop} disabled={!isRunning}>
              Stop
            </button>
            <button className="reset" onClick={onReset} disabled={isRunning}>
              Reset
            </button>
          </div>

          <h3>Simulation Setup</h3>
          <div className="control-group">
            <label htmlFor="seed">
              Random seed (optional) <span className="badge">reproducibility</span>
            </label>
            <input
              type="text"
              id="seed"
              name="seed"
              placeholder="e.g., lesson1 or 12345"
              value={settings.seed}
              onChange={handleSeedChange}
              disabled={isRunning}
            />
            <div className="hint">
              Use any word/number. Same seed → same small variations and instrument
              noise.
            </div>
          </div>

          <div className="control-group">
            <label htmlFor="substanceKey">Substance</label>
            {hideSubstance ? (
              <div style={{ 
                padding: "6px 8px", 
                background: "#f0f0f0", 
                border: "1px solid #ccc", 
                borderRadius: "4px",
                color: "#666",
                fontStyle: "italic"
              }}>
                Unknown (hidden by teacher)
              </div>
            ) : (
              <select
                id="substanceKey"
                name="substanceKey"
                value={settings.substanceKey}
                onChange={handleChange}
                disabled={isRunning}
              >
                <option value="water">Water</option>
                <option value="ethanol">Ethanol</option>
                <option value="acetone">Acetone</option>
                <option value="mercury">Mercury</option>
                <option value="gallium">Gallium</option>
                <option value="sodium_chloride">Sodium Chloride</option>
                <option value="butter">Butter</option>
              </select>
            )}
            <div className="hint">
              Solid floats: <strong>{solidFloats ? "Yes" : "No"}</strong>
            </div>
          </div>

          <div className="control-group">
            <label htmlFor="mass">Sample Mass (g) [5–200]</label>
            <input
              type="range"
              id="mass"
              name="mass"
              min="5"
              max="200"
              step="5"
              value={settings.mass}
              onChange={handleChange}
              disabled={isRunning}
            />
            <span>{settings.mass} g</span>
          </div>

          <div className="control-group">
            <label htmlFor="power">Heater Power (W) [0–500]</label>
            <input
              type="range"
              id="power"
              name="power"
              min="0"
              max="500"
              step="10"
              value={settings.power}
              onChange={handleChange}
            />
            <span>{settings.power} W</span>
          </div>

          <h3>Environment & Equipment</h3>
          <div className="control-group">
            <label htmlFor="instrument">Instrument</label>
            <select
              id="instrument"
              name="instrument"
              value={settings.instrument}
              onChange={handleChange}
              disabled={isRunning}
            >
              <option value="digital">Digital (±0.1°C, 1.2s lag)</option>
              <option value="thermocouple">Thermocouple (±0.05°C, 0.25s lag)</option>
            </select>
          </div>

          <div className="control-group">
            <label htmlFor="insulation">Insulation Level (Heat Loss)</label>
            <select
              id="insulation"
              name="insulation"
              value={settings.insulation}
              onChange={handleChange}
            >

    function MacroView({ simState, solidFloats, displayTemps, substance, mass_kg }) {
      const canvasRef = useRef(null);
      const T_trueDisp = useMemo(
        () =>
          Number(
            (displayTemps?.T_true ?? simState?.T_true ?? 0).toFixed(2)
          ),
        [displayTemps?.T_true, simState?.T_true]
      );
      const T_measDisp = useMemo(
        () =>
          Number(
            (displayTemps?.T_measured ?? simState?.T_measured ?? 0).toFixed(1)
          ),
        [displayTemps?.T_measured, simState?.T_measured]
      );

      useEffect(() => {
        if (!canvasRef.current || !simState) return;
        const { melt_fraction, boil_fraction } = simState;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#f4f7fb";
        ctx.fillRect(0, 0, w, h);

        const beakerW = w * 0.6;
        const beakerH = h * 0.8;
        const beakerX = (w - beakerW) / 2;
        const beakerY = h * 0.1;
        const beakerBottom = beakerY + beakerH;
        ctx.strokeStyle = "#666";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(beakerX, beakerY);
        ctx.lineTo(beakerX, beakerBottom);
        ctx.lineTo(beakerX + beakerW, beakerBottom);
        ctx.lineTo(beakerX + beakerW, beakerY);
        ctx.stroke();

        // Density-aware fill calculation
        const melted_mass_kg = melt_fraction * mass_kg;
        const boiled_mass_kg = boil_fraction * mass_kg;
        const solid_mass_kg = mass_kg - melted_mass_kg;
        
        const density_liquid = substance.density_liquid;
        const density_solid = substance.density_solid || (density_liquid * DEFAULT_SOLID_DENSITY_MULTIPLIER);
        
        // Volumes
        const V_liq = Math.max(0, melted_mass_kg - boiled_mass_kg) / density_liquid;
        const V_sol = solid_mass_kg / density_solid;
        
        // Submerged fraction for solids (ice floats in water)
        const f_sub = Math.min(1, density_solid / density_liquid);
        
        // Displayed fill volume
        const V_fill = V_liq + f_sub * V_sol;
        
        // Convert volume to height
        const fillHeight = Math.min(beakerH * 0.9, V_fill * BEAKER_VOLUME_TO_HEIGHT_SCALE);
        
        // Render liquid
        if (V_liq > 0.000001) {
          ctx.fillStyle = "rgba(0, 120, 220, 0.65)";
          const liquidH = (V_liq / V_fill) * fillHeight;
          ctx.fillRect(beakerX, beakerBottom - liquidH, beakerW, liquidH);
        }
        
        // Render solid
        if (V_sol > 0.000001) {
          ctx.fillStyle = "rgba(173, 216, 230, 0.9)";
          const solidH = (V_sol * f_sub / V_fill) * fillHeight;
          const solidY = solidFloats
            ? Math.max(beakerY + 8, beakerBottom - fillHeight)
            : beakerBottom - solidH;
          ctx.fillRect(beakerX + 6, solidY, beakerW - 12, solidH);
          ctx.strokeStyle = "#9ecde6";
          ctx.strokeRect(beakerX + 6, solidY, beakerW - 12, solidH);
        }
        
        // Render gas plume
        if (boil_fraction > 0.01) {
          ctx.fillStyle = "rgba(180,180,180,0.35)";
          const plumeCount = Math.min(60, Math.floor(15 + boil_fraction * 80));
          for (let i = 0; i < plumeCount; i++) {
            const x = beakerX + Math.random() * beakerW;
            const y = beakerY + beakerH * 0.1 - Math.random() * 24;
            const r = 2 + Math.random() * 4;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Thermometer (measured)
        const thermoX = w * 0.85;
        const thermoTop = h * 0.1;
        const thermoBottom = h * 0.9;
        const thermoH = thermoBottom - thermoTop;

        ctx.fillStyle = "#666";
        ctx.fillRect(thermoX - 2, thermoTop, 4, thermoH);
        ctx.beginPath();
        ctx.arc(thermoX, thermoBottom + 5, 8, 0, Math.PI * 2);
        ctx.fill();

        const tMin = -20,
          tMax = 120;
        const fillFrac = Math.max(
          0,
          Math.min(1, (T_measDisp - tMin) / (tMax - tMin))
        );
        const fillH = fillFrac * (thermoH - 10);
        ctx.fillStyle = "#dc3545";
        ctx.fillRect(thermoX - 2, thermoBottom - fillH, 4, fillH);
        ctx.beginPath();
        ctx.arc(thermoX, thermoBottom + 5, 6, 0, Math.PI * 2);
        ctx.fill();

        // water line
        ctx.strokeStyle = "#fff";
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(beakerX, beakerBottom - fillHeight);
        ctx.lineTo(beakerX + beakerW, beakerBottom - fillHeight);
        ctx.stroke();
        ctx.setLineDash([]);
      }, [simState, solidFloats, T_measDisp, substance, mass_kg]);

      return (
        <>
          <h3>Macroscopic View</h3>
          <div className="legend">
            <span>
              <i
                className="swatch"
                style={{ background: "rgba(173,216,230,0.9)" }}
              ></i>{" "}
              Solid
            </span>
            <span>
              <i
                className="swatch"
                style={{ background: "rgba(0,120,220,0.65)" }}
              ></i>{" "}
              Liquid
            </span>
            <span>
              <i
                className="swatch"
                style={{ background: "rgba(180,180,180,0.35)" }}
              ></i>{" "}
              Gas
            </span>
          </div>
          <canvas
            ref={canvasRef}
            className="vis-canvas"
            width="420"
            height="260"
          ></canvas>
          <div className="data-readout">
            <p>
              Time: <strong>{(simState?.time ?? 0).toFixed(1)} s</strong>
            </p>
            <p>
              Phase: <strong>{simState?.phase || "..."}</strong>
            </p>
            <p>
              True Temp: <strong>{T_trueDisp.toFixed(1)} °C</strong>
            </p>
            <p>
              Measured Temp: <strong>{T_measDisp.toFixed(1)} °C</strong>
            </p>
          </div>
        </>
      );
    }

    // Atomic-scale view with p5.js
    function AtomicView({ simState, solidFloats }) {
      const containerRef = useRef(null);
      const p5InstanceRef = useRef(null);
      const simStateRef = useRef(simState);

      // Keep simState in sync with ref for p5 access
      useEffect(() => {
        simStateRef.current = simState;
      }, [simState]);

      useEffect(() => {
        if (!containerRef.current) return;

        // p5.js sketch
        const sketch = (p) => {
          const NUM_PARTICLES = 200;
          const PARTICLE_RADIUS = 4;
          const RESET_DISTANCE_FROM_BOTTOM = 30;
          const BOILING_ZONE_HEIGHT = 80;
          let particles = [];
          let blockOffset = { x: 0, y: 0 };
          const canvasWidth = 420;
          const canvasHeight = 260;

          // Particle class
          class Particle {
            constructor(gridX, gridY) {
              this.gridX = gridX;
              this.gridY = gridY;
              this.x = gridX;
              this.y = gridY;
              this.vx = 0;
              this.vy = 0;
              this.state = 'SOLID';
            }

            update() {
              if (this.state === 'SOLID') {
                // Solid particles: strong gravity, weak spring to maintain rough shape
                // Stronger gravity to ensure bottom particles sink to container floor
                this.vy += 0.25;
                
                // Much weaker spring force to grid position - just keeps particles together loosely
                const targetX = this.gridX + blockOffset.x;
                const targetY = this.gridY + blockOffset.y;
                this.vx += (targetX - this.x) * 0.02;
                this.vy += (targetY - this.y) * 0.02;
                
                // Add small vibration
                this.vx += (p.random(-1, 1)) * 0.1;
                this.vy += (p.random(-1, 1)) * 0.1;
                
                // Strong damping to prevent bouncing
                this.vx *= 0.80;
                this.vy *= 0.80;
              } else if (this.state === 'LIQUID') {
                // Gravity
                this.vy += 0.1;
                // Brownian motion
                this.vx += (p.random(-1, 1)) * 0.4;
                this.vy += (p.random(-1, 1)) * 0.4;
                // Damping
                this.vx *= 0.95;
                this.vy *= 0.95;
              } else if (this.state === 'GAS') {
                // Gas particles: ignore gravity, move in straight lines
                // No gravity, no additional forces - pure inertial motion
                // Minimal damping to maintain straight-line velocity
                this.vx *= 0.995;
                this.vy *= 0.995;
              }

              // Update position
              this.x += this.vx;
              this.y += this.vy;

              // Boundary collisions
              const margin = 20;
              if (this.x < margin) {
                this.x = margin;
                this.vx *= -0.8;  // Bounce off walls
              }
              if (this.x > canvasWidth - margin) {
                this.x = canvasWidth - margin;
                this.vx *= -0.8;  // Bounce off walls
              }
              
              if (this.state === 'GAS') {
                // Gas particles bounce off top and bottom walls
                if (this.y < margin) {
                  this.y = margin;
                  this.vy *= -0.8;
                }
                if (this.y > canvasHeight - margin) {
                  this.y = canvasHeight - margin;
                  this.vy *= -0.8;
                }
              } else {
                // Solid and liquid particles bounce off top, stop at bottom
                if (this.y < margin) {
                  this.y = margin;
                  this.vy *= -0.5;
                }
                if (this.y > canvasHeight - margin) {
                  this.y = canvasHeight - margin;
                  this.vy *= -0.5;
                }
              }

              // Gas particles that escape off canvas edges recycle
              // This shouldn't happen often with proper bouncing, but as a safety net
              if (this.state === 'GAS' && (this.y < -10 || this.y > canvasHeight + 10)) {
                this.state = 'LIQUID';
                this.y = canvasHeight - RESET_DISTANCE_FROM_BOTTOM;
                this.x = p.random(margin, canvasWidth - margin);
                this.vx = 0;
                this.vy = 0;
              }
            }

            display() {
              p.noStroke();
              if (this.state === 'SOLID') {
                p.fill(173, 216, 230); // Light blue
              } else if (this.state === 'LIQUID') {
                p.fill(0, 120, 220, 200); // Blue with transparency
              } else {
                p.fill(200, 200, 200, 180); // Gray with transparency
              }
              p.circle(this.x, this.y, PARTICLE_RADIUS * 2);
            }
          }

          p.setup = () => {
            p.createCanvas(canvasWidth, canvasHeight);
            
            // Initialize particles in a grid at the bottom
            const cols = 20;
            const rows = Math.ceil(NUM_PARTICLES / cols);
            const spacing = 8;
            const startX = (canvasWidth - cols * spacing) / 2;
            const startY = canvasHeight - 40;

            for (let i = 0; i < NUM_PARTICLES; i++) {
              const col = i % cols;
              const row = Math.floor(i / cols);
              const gridX = startX + col * spacing;
              const gridY = startY - row * spacing;
              particles.push(new Particle(gridX, gridY));
            }
          };

          p.draw = () => {
            p.background(34, 34, 34);

            const state = simStateRef.current || {};
            const { melt_fraction = 0, boil_fraction = 0, phase = 'solid' } = state;

            // Calculate target counts for each phase
            const numToMelt = Math.floor(melt_fraction * NUM_PARTICLES);
            const numToBoil = Math.floor(boil_fraction * NUM_PARTICLES);

            // Melt particles from bottom to top
            const solidParticles = particles.filter(p => p.state === 'SOLID');
            // Sort by Y position (bottom first), then randomize within same Y level
            solidParticles.sort((a, b) => {
              const yDiff = b.gridY - a.gridY;
              if (Math.abs(yDiff) < 1) {
                // Same row - randomize order
                return p.random() - 0.5;
              }
              return yDiff;
            });
            
            const currentlyMelted = NUM_PARTICLES - solidParticles.length;
            const additionalMeltsNeeded = Math.max(0, numToMelt - currentlyMelted);
            
            for (let i = 0; i < Math.min(additionalMeltsNeeded, solidParticles.length); i++) {
              if (solidParticles[i]) {
                solidParticles[i].state = 'LIQUID';
              }
            }

            // Boil liquid particles - prefer those near bottom but use any if needed
            const liquidParticles = particles.filter(p => p.state === 'LIQUID');
            const liquidsNearBottom = liquidParticles
              .filter(p => p.y > canvasHeight - BOILING_ZONE_HEIGHT)
              .sort((a, b) => b.y - a.y);
            
            // Also get all liquid particles sorted by Y as fallback
            const allLiquids = liquidParticles.sort((a, b) => b.y - a.y);
            
            const currentGas = particles.filter(p => p.state === 'GAS').length;
            const gasNeeded = Math.max(0, numToBoil - currentGas);
            
            // Use liquids near bottom first, then use any liquid if not enough near bottom
            const liquidsToBoil = liquidsNearBottom.length >= gasNeeded ? liquidsNearBottom : allLiquids;
            
            for (let i = 0; i < Math.min(gasNeeded, liquidsToBoil.length); i++) {
              if (liquidsToBoil[i]) {
                liquidsToBoil[i].state = 'GAS';
                // Give gas particles random straight-line velocities in all directions
                const angle = p.random(0, Math.PI * 2);
                const speed = p.random(2, 4);
                liquidsToBoil[i].vx = Math.cos(angle) * speed;
                liquidsToBoil[i].vy = Math.sin(angle) * speed;
              }
            }

            // Make solid block sink as it melts
            const solidCount = particles.filter(p => p.state === 'SOLID').length;
            const sinkAmount = (NUM_PARTICLES - solidCount) * 0.15;
            if (!solidFloats) {
              blockOffset.y = sinkAmount;
            } else {
              // Ice floats - move block up as it melts
              blockOffset.y = -sinkAmount * 0.5;
            }

            // Update and display particles
            for (let particle of particles) {
              particle.update();
              particle.display();
            }

            // Draw beaker walls
            p.noFill();
            p.stroke(100, 100, 100);
            p.strokeWeight(3);
            p.line(20, 20, 20, canvasHeight - 20);
            p.line(canvasWidth - 20, 20, canvasWidth - 20, canvasHeight - 20);
            p.line(20, canvasHeight - 20, canvasWidth - 20, canvasHeight - 20);

            // Draw heat source (flame)
            const heaterPower = state?.logEntry?.heater_power_W || 0;
            if (heaterPower > 0) {
              const flameIntensity = Math.min(1, heaterPower / 500);
              p.noStroke();
              
              // Draw flame
              for (let i = 0; i < 10; i++) {
                const x = p.random(40, canvasWidth - 40);
                const y = canvasHeight - 15 - p.random(0, 10);
                const size = p.random(3, 8) * flameIntensity;
                p.fill(255, p.random(100, 200), 0, 150);
                p.circle(x, y, size);
              }
            }

            // Draw phase label
            p.fill(255);
            p.noStroke();
            p.textSize(14);
            p.textAlign(p.LEFT);
            p.text(`Phase: ${phase}`, 30, 40);
          };
        };

        // Create p5 instance
        p5InstanceRef.current = new p5(sketch, containerRef.current);

        // Cleanup
        return () => {
          if (p5InstanceRef.current) {
            p5InstanceRef.current.remove();
            p5InstanceRef.current = null;
          }
        };
      }, [solidFloats]);

      return (
        <>
          <h3>Atomic-Scale View (Simplified)</h3>
          <div ref={containerRef} className="atomic-canvas"></div>
        </>
      );
    }

    function GraphView({ logger, graphType }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const ctx = canvasRef.current.getContext("2d");
        if (chartRef.current) chartRef.current.destroy();

        const labels =
          graphType === "time"
            ? logger.data.map((d) => Number(d.time_s.toFixed(1)))
            : logger.data.map((d) =>
                Number((d.cumulative_heat_J / 1000).toFixed(2))
              );

        const measured = logger.data.map((d) =>
          Number(d.temp_measured_C.toFixed(1))
        );
        const truth = logger.data.map((d) =>
          Number(d.temp_true_C.toFixed(1))
        );

        chartRef.current = new ChartJS(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Measured Temp (°C)",
                data: measured,
                borderColor: "rgba(220,53,69,0.9)",
                backgroundColor: "rgba(220,53,69,0.15)",
                borderWidth: 2,
                pointRadius: 0
              },
              {
                label: "True Temp (°C)",
                data: truth,
                borderColor: "rgba(0,123,255,0.9)",
                backgroundColor: "rgba(0,123,255,0.12)",
                borderWidth: 2,
                pointRadius: 0,
                borderDash: [5, 4]
              }
            ]
          },
          options: {
            animation: false,
            responsive: true,
            scales: {
              x: {
                title: {
                  display: true,
                  text:
                    graphType === "time"
                      ? "Time (s)"
                      : "Cumulative Heat Added (kJ)"
                },
                ticks: {
                  callback: (val, idx) => {
                    const raw = labels[idx];
                    return graphType === "time"
                      ? raw.toFixed(1)

              y: {
                title: { display: true, text: "Temperature (°C)" },

              }
            },
            plugins: {
              tooltip: {
                callbacks: {
                  label: (ctx) =>
                    `${ctx.dataset.label}: ${Number(ctx.parsed.y).toFixed(
                      1
                    )} °C`,

                    const x = items[0].parsed.x;
                    return graphType === "time"
                      ? `t = ${Number(x).toFixed(1)} s`
                      : `Q = ${Number(x).toFixed(2)} kJ`;
                  }
                }
              },
              legend: { display: true },
              title: {
                display: true,
                text:
                  "Temperature vs. " +
                  (graphType === "time" ? "Time" : "Heat Added")
              }
            }
          }
        });

        return () => chartRef.current?.destroy();
      }, [logger.data.length, graphType]);

      return (
        <div className="graph-container">
          <canvas ref={canvasRef} width="420" height="320"></canvas>

        return parseFloat(params.get("timeScale")) || 1.0;
      });
      const [idealizedLiquid, setIdealizedLiquid] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get("idealizedLinearLiquid") === "true";
      });
      
      // Hide substance mode for student exploration
      const [hideSubstance, setHideSubstance] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get("hideSubstance") === "true";
      });

      // Teacher lock for graph (default locked; URL ?key=... unlocks)
      const [graphUnlocked, setGraphUnlocked] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        const key = params.get("key");
        return key ? true : false;
      });
      const [passwordInput, setPasswordInput] = useState("");
      const TEACHER_PASSWORD = useMemo(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get("key") || "science";
      }, []);

      // EMA for calmer on-screen display (CSV uses raw)
      const displayMeasured = useEMA(
        simState?.logEntry?.temp_measured_C ?? simState?.T_measured ?? -10,
        0.2
      );
      const displayTrue = useEMA(
        simState?.logEntry?.temp_true_C ?? simState?.T_true ?? -10,
        0.2
      );

      // Reset when seed changes
      useEffect(() => {
        sim.reset(settings.seed);
        setSimState(sim.getState());
      }, [settings.seed]);

      // Change substance: stop, new engine, reset
      useEffect(() => {
        if (isRunning && intervalRef.current) {
          clearInterval(intervalRef.current);
        }
        setIsRunning(false);
        const newSim = new PhysicsEngine(Substances[settings.substanceKey], settings.seed);
        setSim(newSim);
        setSimState(newSim.getState());
        setAnalysis("");
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [settings.substanceKey]);

      const start = () => {
        if (isRunning) return;
        setIsRunning(true);

        const baseLoss = 6; // W/K baseline (lowered from 8 for realistic boiling at 500W)
        const lossFactor = Number(settings.insulation);
        const hA = baseLoss * lossFactor;
        const dt = 0.1;
        const mass_kg = settings.mass / 1000;

        // Apply teacher controls to engine
        sim.idealizedLinearLiquid = idealizedLiquid;
        sim.pressure_kPa = settings.pressure_kPa;

        sim.logger.setMetadata({
          substance: Substances[settings.substanceKey].name,
          mass_g: settings.mass,
          instrument: settings.instrument,
          ambient_C: settings.T_ambient,
          heater_power_W: settings.power,
          insulation_factor: lossFactor,
          seed: settings.seed || "(none)",
          pressure_kPa: settings.pressure_kPa,
          idealized_liquid: idealizedLiquid,
          time_scale: timeScale
        });

        intervalRef.current = setInterval(() => {
          const dt_sim = dt * timeScale; // Apply time scale
          const state = sim.step(
            dt_sim,
            settings.power,
            hA,
            settings.T_ambient,
            mass_kg,
            settings.instrument
          );
          setSimState(state); // raw state; we smooth only for display
        }, dt * 1000);
      };

      const stop = () => {
        setIsRunning(false);
        if (intervalRef.current) clearInterval(intervalRef.current);
      };
      const reset = () => {
        if (intervalRef.current) clearInterval(intervalRef.current);
        setIsRunning(false);
        sim.reset(settings.seed);
        setSimState(sim.getState());
        setAnalysis("");
      };

      const onAnalyze = () => {
        const data = sim.logger.data;
        if (data.length < 10)
          return setAnalysis("Not enough data yet. Run the sim a bit longer.");
        const temps = data.map((d) => d.temp_measured_C);
        const heats = data.map((d) => d.cumulative_heat_J);
        const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
        const first = avg(temps.slice(0, Math.min(20, temps.length)));
        const last = avg(temps.slice(-Math.min(20, temps.length)));
        const totalQkJ = (heats[heats.length - 1] - heats[0]) / 1000;
        setAnalysis(
          `Start Avg: ${first.toFixed(1)} °C; End Avg: ${last.toFixed(
            1
          )} °C; Total heat added ≈ ${totalQkJ.toFixed(2)} kJ.`
        );
      };

      const onDownloadCSV = () => {
        const csv = sim.logger.generateCSV();
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const ts = new Date().toISOString().replace(/[:.]/g, "-");
        a.download = `virtual-lab-${ts}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const unlockGraph = () => {
        if (passwordInput.trim() === TEACHER_PASSWORD) setGraphUnlocked(true);
        else alert("Incorrect password");
      };

      const generateShareURL = () => {
        const params = new URLSearchParams();
        params.set("substanceKey", settings.substanceKey);
        params.set("mass", settings.mass.toString());
        params.set("power", settings.power.toString());
        params.set("instrument", settings.instrument);
        params.set("insulation", settings.insulation.toString());
        params.set("T_ambient", settings.T_ambient.toString());
        params.set("pressure_kPa", settings.pressure_kPa.toString());
        params.set("timeScale", timeScale.toString());
        params.set("idealizedLinearLiquid", idealizedLiquid.toString());
        if (settings.seed) {
          params.set("seed", settings.seed);
        }
        if (hideSubstance) {
          params.set("hideSubstance", "true");
        }
        const baseURL = window.location.origin + window.location.pathname;
        return `${baseURL}?${params.toString()}`;
      };

      const onShareScenario = () => {
        const url = generateShareURL();
        // Clipboard API requires HTTPS in most browsers
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).then(() => {
            alert("Link copied to clipboard!");
          }).catch(() => {
            alert("Failed to copy. URL:\n" + url);
          });
        } else {
          // Fallback for HTTP or browsers without clipboard API
          const textarea = document.createElement('textarea');
          textarea.value = url;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            alert("Link copied to clipboard!");
          } catch (err) {
            alert("Failed to copy. URL:\n" + url);
          }
          document.body.removeChild(textarea);
        }
      };

      const onOpenInNewTab = () => {
        const url = generateShareURL();
        window.open(url, "_blank");
      };

      const solidFloats = Substances[settings.substanceKey].solidFloats;
      const substance = Substances[settings.substanceKey];
      const mass_kg = settings.mass / 1000;

      return (
        <div className="app-container">
          <Controls
            settings={settings}
            setSettings={setSettings}
            onStart={start}
            onStop={stop}
            onReset={reset}
            isRunning={isRunning}
            solidFloats={solidFloats}
            hideSubstance={hideSubstance}
          />
          <div className="panel center-panel">
            <MacroView
              simState={simState}
              solidFloats={solidFloats}
              displayTemps={{ T_true: displayTrue, T_measured: displayMeasured }}
              substance={substance}
              mass_kg={mass_kg}
            />
            <AtomicView simState={simState} solidFloats={solidFloats} />
          </div>
          <div className="panel right-panel">
            {!graphUnlocked ? (
              <div className="graph-lock">
                <h3>Teacher Tools (Locked)</h3>
                <div className="control-group">
                  <label htmlFor="teacherPassword">
                    Enter password to unlock graph and data tools
                  </label>
                  <input
                    id="teacherPassword"
                    type="password"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    placeholder="Password"
                  />
                </div>
                <button onClick={unlockGraph} className="start">
                  Unlock
                </button>
                <div className="hint" style={{ marginTop: 8 }}>
                  Tip: Convenience gate only (not strong security). You can also
                  unlock via URL with ?key=YourPassword
                </div>
              </div>
            ) : (
              <>
                <TeacherControls
                  timeScale={timeScale}
                  setTimeScale={setTimeScale}
                  idealizedLiquid={idealizedLiquid}
                  setIdealizedLiquid={setIdealizedLiquid}
                  isRunning={isRunning}
                  onShareScenario={onShareScenario}
                  onOpenInNewTab={onOpenInNewTab}
                />
                <GraphView logger={sim.logger} graphType={graphType} />
                <DataAndAnalysis
                  logger={sim.logger}
                  onDownloadCSV={onDownloadCSV}
                  onAnalyze={onAnalyze}
                  analysis={analysis}
                  onGraphTypeChange={setGraphType}
                  graphType={graphType}
                />
              </>
            )}
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
